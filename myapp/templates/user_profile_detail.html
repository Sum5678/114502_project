{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ user.username }} 的個人資料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .profile-card {
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        /* 各等級卡片效果 */
        .level-1 { box-shadow: 0 0 8px rgba(184,115,51,0.4),0 8px 15px rgba(0,0,0,0.1); }
        .level-2 { background: linear-gradient(135deg,#f0f0f0,#d9d9d9); box-shadow:0 0 10px rgba(192,192,192,0.4),0 8px 18px rgba(0,0,0,0.1); }
        .level-3 { background: linear-gradient(135deg,#fff8dc,#ffe680); box-shadow:0 0 15px rgba(255,215,0,0.4),0 8px 20px rgba(0,0,0,0.1); }
        .level-4,.level-5 { background: linear-gradient(135deg,#e5e4e2,#f0f8ff,#e5e4e2); background-size:400% 400%; animation: gradientAnimation 8s ease infinite; box-shadow:0 0 20px rgba(255,255,255,0.6),0 8px 20px rgba(0,0,0,0.1); }

        @keyframes gradientAnimation {
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        /* 金牌星光粒子 */
        .level-3::before {
            content:'';
            position:absolute;
            top:-50%; left:-50%;
            width:200%; height:200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px) repeat;
            background-size:10px 10px;
            animation: starMove 6s linear infinite;
            pointer-events:none;
        }
        @keyframes starMove { 0%{transform:translate(0,0) rotate(0deg);} 100%{transform:translate(50px,50px) rotate(360deg);} }

        /* 使用者圖片 */
        .user-images img {
            border-radius: 10px; border:2px solid #dee2e6; margin:5px; object-fit:cover;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        /* 圖片 hover 各等級 */
        .level-1 .user-images img:hover { transform:scale(1.05); border-color:#b87333; box-shadow:0 0 8px rgba(184,115,51,0.5);}
        .level-2 .user-images img:hover { transform:scale(1.08); border-color:#c0c0c0; box-shadow:0 0 12px rgba(192,192,192,0.5);}
        .level-3 .user-images img:hover { transform:scale(1.1); border-color:gold; box-shadow:0 0 15px rgba(255,215,0,0.6);}
        .level-4 .user-images img:hover { transform:scale(1.1); border-color:#c0c0c0; box-shadow:0 0 20px rgba(255,255,255,0.8),0 0 30px rgba(173,216,230,0.6);}
        .level-5 .user-images img:hover { transform:scale(1.1); border-color:#0dcaf0; box-shadow:0 0 25px rgba(13,202,240,0.8),0 0 35px rgba(173,216,230,0.6);}

        .badge-level { font-size:1rem; padding:0.5em 0.8em; }

    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="profile-card text-center level-{{ user.membership_level }}">
                <h2 style="color: {{ level_style.color }}">{{ user.username }}</h2>
                <span class="badge bg-{{ level_style.badge }} badge-level">{{ level_style.name }}</span>
                <hr>
                <h5>自我介紹</h5>
                <p>{{ user.self_intro|default:"尚未填寫" }}</p>
                <h5>累積付費</h5>
                <p>{{ user.total_paid }} 元</p>
                <h5>狀態顏色</h5>
                <div style="width:50px;height:50px;margin:0 auto;background-color:{{ user.status_color }};border-radius:50%;border:2px solid #000"></div>
                <h5 class="mt-4">使用者圖片</h5>
                <div class="user-images d-flex flex-wrap justify-content-center">
                    {% if images_list %}
                        {% for img_url in images_list %}
                            <img src="{{ img_url }}" alt="user image" width="100" height="100">
                        {% endfor %}
                    {% else %}
                        <p>尚未上傳圖片</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
