<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <title>編輯警局資料</title>

    <!-- ✅ Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>
        .form-label {
            font-weight: bold;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
        }
        .button:hover {
            background-color: #45a049;
        }
        .cancel-btn {
            background-color: #6c757d;
        }
        .cancel-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body class="bg-light">

<!-- 新增的彈跳提醒框 Modal -->
<div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="alertModalLabel">重要提醒</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
      </div>
      <div class="modal-body" style="white-space: pre-wrap;">
        由於部分地區（如新竹市、嘉義市）的多個行政區共用相同郵遞區號（如新竹市東區、北區、香山區皆為 300，嘉義市東區、西區皆為600），為確保查詢功能的正確性，本系統採用延伸編碼方式（如 300-1、300-2、300-3、600-1、600-2）區分各行政區。
        
        管理者在新增、編輯或刪除資料時，請務必確認：
        ●  區域名稱與延伸郵遞區號的對應正確無誤
        ●  不可誤刪或誤改相同郵遞區號但不同區域的資料
        ●  請在編輯時特別注意！
      </div>
    </div>
  </div>
</div>
<!-- 彈跳框結束 -->

<div class="container-sm my-5" id="main-content" style="display:none;"> <!-- 預設先隱藏整個頁面內容，等關閉彈跳框才顯示 -->
    <div class="text-center mb-4">
        <h1>編輯警局資料</h1>
    </div>

    <form method="post" class="mx-auto" style="max-width: 600px;">
        {% csrf_token %}
        <div class="mb-3">
            <label for="precinct_name" class="form-label">警局名稱</label>
            <input type="text" class="form-control" id="precinct_name" name="precinct_name" value="{{ address.precinct_name }}" required />
        </div>
        <div class="mb-3">
            <label for="zipcode" class="form-label">郵遞區號</label>
            <input type="text" class="form-control" id="zipcode" name="zipcode" value="{{ address.zipcode }}" required />
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">地址</label>
            <textarea class="form-control" id="address" name="address" rows="2" required>{{ address.address }}</textarea>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">電話</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ address.phone }}" required />
        </div>
        <div class="mb-3">
            <label for="POINT_X" class="form-label">經度 (POINT_X)</label>
            <input type="text" class="form-control" id="POINT_X" name="POINT_X" value="{{ address.POINT_X }}" required />
        </div>
        <div class="mb-3">
            <label for="POINT_Y" class="form-label">緯度 (POINT_Y)</label>
            <input type="text" class="form-control" id="POINT_Y" name="POINT_Y" value="{{ address.POINT_Y }}" required />
        </div>

        <div class="text-center">
            <button type="submit" class="button">儲存變更</button>
            <a href="{% url 'police_address_list' %}" class="button cancel-btn ms-2">取消</a>
        </div>
    </form>
</div>

<!-- Bootstrap 5 JS (含 Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var alertModal = new bootstrap.Modal(document.getElementById('alertModal'));
    alertModal.show();

    document.getElementById('alertModal').addEventListener('hidden.bs.modal', function () {
      document.getElementById('main-content').style.display = 'block';
    });
  });
</script>

</body>
</html>
