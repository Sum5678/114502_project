<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家審核狀態</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #e6f2f8;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      color: #2c3e50;
    }

    .status-section {
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
      font-size: 22px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reviewing {
      background-color: #5dade2;
    }

    .completed {
      background-color: #48c9b0;
    }

    .checkmark {
      font-size: 28px;
      margin-left: 20px;
    }

    button {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>商家審核狀態</h2>

    <div class="status-section reviewing">
      <span>審核中</span>
      <span id="reviewingCheck" class="checkmark"></span>
    </div>

    <div class="status-section completed">
      <span>審核完成</span>
      <span id="completedCheck" class="checkmark"></span>
    </div>

    <button onclick="location.href='business_list.html'">返回紀錄</button>
  </div>

  <script>
    // 假設只顯示第一筆商家資料的狀態
    const businesses = JSON.parse(localStorage.getItem("businesses")) || [];

    if (businesses.length > 0) {
      const business = businesses[0]; // 顯示第 1 筆商家狀態
      if (business.status === "審核完成") {
        document.getElementById("completedCheck").textContent = "✔";
      } else {
        document.getElementById("reviewingCheck").textContent = "✔";
      }
    } else {
      alert("❌ 找不到商家資料");
    }
  </script>
</body>
</html>
