<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>綠界金流 - 轉跳中</title>
</head>
<body>
    <p>系統將自動轉跳到綠界付款頁面，請稍候...</p>
    <form id="ecpay-form" method="post" action="{{ action_url }}">
        {% for key, value in final_params.items %}

        document.getElementById('ecpay-form').submit();
    </script>
</body>
</html>
