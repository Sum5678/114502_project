<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款頁面</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f6fa;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 900px;
    margin: 50px auto;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
  }
  /* 訂單摘要區 */
  .order-summary {
    flex: 1;
    min-width: 280px;
    background-color: #fff;
    border-radius: 12px;
    padding: 20px 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .order-summary h2 {
    margin-top: 0;
    color: #333;
    font-size: 20px;
  }
  .order-summary p {
    margin: 10px 0;
    color: #555;
    font-size: 16px;
  }
  .order-summary .total {
    font-weight: bold;
    font-size: 18px;
    margin-top: 15px;
  }

  /* 付款表單區 */
  .payment-form {
    flex: 1;
    min-width: 280px;
    background-color: #fff;
    border-radius: 12px;
    padding: 20px 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  .payment-form h2 {
    margin-top: 0;
    text-align: center;
    color: #333;
    font-size: 20px;
  }
  .payment-form form {
    display: flex;
    flex-direction: column;
  }
  .payment-form input {
    padding: 12px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
  }
  .payment-form .card-row {
    display: flex;
    gap: 10px;
  }
  .payment-form .card-row input {
    flex: 1;
  }
  .payment-form .card-icons {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .payment-form .card-icons img {
    width: 50px;
    opacity: 0.5;
  }
  .payment-form button {
    margin-top: 20px;
    padding: 12px 20px;
    font-size: 16px;
    background-color: #0071c2;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .payment-form button:hover {
    background-color: #005fa3;
  }
  .note {
    font-size: 14px;
    color: #888;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 訂單摘要 -->
  <div class="order-summary">
    <h2>訂單摘要</h2>
    <p>付款品項：<strong>{{ item }}</strong></p>
    <!-- <p>房型：<strong>{{ room_type|default:"標準雙人房" }}</strong></p> -->
    <p class="total">付款金額：<strong>{{ default_amount }} 元</strong></p>
  </div>

  <!-- 付款表單 -->
  <div class="payment-form">
    <h2>信用卡付款</h2>

    <div class="card-icons">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" alt="Visa">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="MasterCard">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/JCB_logo.svg" alt="JCB">
    </div>

    <form onsubmit="alert('模擬付款完成！'); return false;">
      {% csrf_token %}
      <input type="hidden" name="amount" value="{{ default_amount }}">
      <input type="hidden" name="item" value="{{ item }}">
      <input type="hidden" name="next" value="{{ next|default:'/' }}">

      <input type="text" name="card_name" placeholder="持卡人姓名" required>
      <input type="text" name="card_number" placeholder="信用卡號 1234 5678 9012 3456" required pattern="\d{13,16}">
      
      <div class="card-row">
        <input type="text" name="expiry" placeholder="到期日 MM/YY" required pattern="\d{2}/\d{2}">
        <input type="text" name="cvc" placeholder="CVC" required pattern="\d{3,4}">
      </div>

      <button type="submit">立即付款</button>
    </form>
    <p class="note">此頁面為模擬付款，資料不會被存取。</p>
  </div>
</div>

</body>
</html>
