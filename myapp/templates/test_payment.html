<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款頁面</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f6fa;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 600px;
    margin: 40px auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    padding: 25px;
  }
  h2 {
    text-align: center;
    font-size: 22px;
    color: #333;
    margin-bottom: 20px;
  }
  /* 訂單摘要 */
  .order-summary {
    border-bottom: 1px solid #eee;
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .order-summary p {
    margin: 8px 0;
    font-size: 16px;
    color: #555;
  }
  .order-summary strong {
    color: #000;
  }
  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 2px solid #eee;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    color: #555;
    border-bottom: 3px solid transparent;
    transition: 0.3s;
  }
  .tab.active {
    color: #00b45a;
    border-bottom-color: #00b45a;
  }
  /* 表單 */
  .form-section {
    display: none;
  }
  .form-section.active {
    display: block;
  }
  button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background-color: #00b45a;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #00964d;
  }
</style>
</head>
<body>

<div class="container">
  <h2>模擬付款</h2>

  <!-- 訂單摘要 -->
  <div class="order-summary">
    <p>付款金額：{{ default_amount }} 元</p>
    <p>付款品項：{{ item }}</p>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('credit')">信用卡</div>
    <div class="tab" onclick="switchTab('atm')">ATM轉帳</div>
    <div class="tab" onclick="switchTab('cvs')">超商代碼</div>
  </div>

  <!-- 信用卡付款 -->
  <div id="credit" class="form-section active">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="amount" value="{{ default_amount }}">
      <input type="hidden" name="item" value="{{ item }}">
      <input type="hidden" name="next" value="{{ next|default:'/' }}">
      <button type="submit">測試付款點我</button>
    </form>
  </div>

  <!-- ATM付款 -->
  <div id="atm" class="form-section">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="amount" value="{{ default_amount }}">
      <input type="hidden" name="item" value="{{ item }}">
      <input type="hidden" name="next" value="{{ next|default:'/' }}">
      <button type="submit">測試付款點我</button>
    </form>
  </div>

  <!-- 超商付款 -->
  <div id="cvs" class="form-section">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="amount" value="{{ default_amount }}">
      <input type="hidden" name="item" value="{{ item }}">
      <input type="hidden" name="next" value="{{ next|default:'/' }}">
      <button type="submit">測試付款點我</button>
    </form>
  </div>
</div>

<script>
  function switchTab(id) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
    document.querySelector('.tab[onclick="switchTab(\''+id+'\')"]').classList.add('active');
    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
