{% load static %}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>互動首頁</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: auto;
        } */

        svg {
            width: 1024px;
            height: 1024px;
            display: block;
            margin: auto;
        }

        body {
            width: 1024px;
            margin: auto;
        }



        .click-area {
            fill: transparent;
            cursor: pointer;
            transition: fill 0.3s;
        }

        .click-area:hover {
            fill: rgba(255, 255, 0, 0.3); /* 滑鼠 hover 效果 */
        }

        @media (hover: none) {
            .click-area:active {
                fill: rgba(255, 255, 0, 0.5); /* 手機點擊時亮起 */
            }
        }

        svg image {
            width: 1024px;
            height: 1024px;
        }
    </style>
</head>
<body>
    
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
        <!-- 背景圖片 -->
        <image href="{% static 'img/1000004578.jpg' %}" width="1024" height="1024" />
    
        <!-- 點擊區域：你可以用多邊形來設定 -->
        <a href="{% url 'announcement' %}">
            <polygon class="click-area" points="723.6,266.45 782.69,266.45 782.69,660.65 723.6,660.65" />
        </a>
        
        <a href="{% url 'chatroom' %}">
            <polygon class="click-area" points="813.61,76.89 991.91,76.89 991.91,411.73 813.61,411.73" />
        </a>
    
        <!--   #公佈欄 -->
        <a href="{% url 'form' %}">
            <polygon class="click-area" points="9.87,25.65 191.87,25.65 191.87,485.65 9.87,485.65" />

        </a>
    
        <a href="{% url 'safety' %}">
            <polygon class="click-area" points="756.91,673.99 974.06,673.99 974.06,1021.74 756.91,1021.74" />
        </a>
    
        <a href="{% url 'autodial' %}">
            <polygon class="click-area" points="359.34,351.49 484.98,351.49 484.98,657.69 359.34,657.69" />
        </a>
    
        <a href="{% url 'mymap' %}">
            <polygon class="click-area" points="530.93,351.49 656.74,351.49 656.74,657.69 530.93,657.69" />
        </a>
    
        <a href="{% url 'settings' %}">
            <polygon class="click-area" points="240.73,266.45 302.29,266.45 302.29,667.51 240.73,667.51" />
        </a>
    
        <a href="{% url 'write' %}">
            <polygon class="click-area" points="21.69,683.78 273.73,683.78 273.73,1021.74 21.69,1021.74" />
        </a>
    </svg>
    
    <!-- JavaScript 代碼 -->
    <script>
        window.onload = function() {
            // 獲取 SVG 和圖片元素
            var svg = document.querySelector('svg');
            var image = svg.querySelector('image');
    
            // 計算圖片的實際顯示尺寸
            

            var svgWidth = image.getBoundingClientRect().width;
            var svgHeight = image.getBoundingClientRect().height;

    
            // 獲取 SVG 容器的寬高
            var svgWidth = svg.clientWidth;
            var svgHeight = svg.clientHeight;
    
            // 設定每個可點擊區域的多邊形座標
            var polygons = document.querySelectorAll('.click-area');
    
            // 根據 SVG 容器的大小，動態調整多邊形座標
            polygons.forEach(function(polygon) {
                var points = polygon.getAttribute('points').split(' ');
                var newPoints = points.map(function(point) {
                    var coords = point.split(',');
                    var x = (parseFloat(coords[0]) / 1024) * svgWidth; // 根據 SVG 寬度調整 X 座標
                    var y = (parseFloat(coords[1]) / 1024) * svgHeight; // 根據 SVG 高度調整 Y 座標
                    return x + ',' + y;
                }).join(' '); 
                polygon.setAttribute('points', newPoints); // 更新多邊形的座標
            });
        };
    </script>
</body>
</html>
