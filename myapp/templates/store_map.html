<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>通過審核的安全商家</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>通過審核的安全商家</h1>
    <div id="map"></div>

    <script>
        let map;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 25.0330, lng: 121.5654 },  // 台北市中心
                zoom: 12,
            });

            fetch('/api/approved_stores/')
                .then(response => response.json())
                .then(data => {
                    data.forEach(store => {
                        new google.maps.Marker({
                            position: {
                                lat: parseFloat(store.latitude),
                                lng: parseFloat(store.longitude)
                            },
                            map,
                            title: store.store_name
                        });
                    });
                });
        }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap">
    </script>
</body>
</html>
