<!DOCTYPE html> 
<html>
<head>
  <meta charset="UTF-8">
  <title>修改審核狀態 - {{ object.display_name }}</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f0f8ff; /* 淺藍底 */
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #336699;
      margin-bottom: 30px;
    }

    form {
      width: 50%;
      margin: auto;
      padding: 20px;
      background-color: #ffffff;
      border: 1px solid #cce;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    form p {
      margin-bottom: 15px;
    }

    button {
      background-color: #66aaff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #5588dd;
    }

    p a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0066cc;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>修改審核狀態 - {{ object.display_name }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">儲存</button>
  </form>
  <p><a href="{% url 'pemap_list' %}">← 回列表</a></p>
</body>
</html>
