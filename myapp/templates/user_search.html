{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>搜尋用戶</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .search-card {
            margin-top: 50px;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .user-item {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            transition: background 0.2s;
        }
        .user-item:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="search-card">
                <h3 class="text-center mb-4">搜尋用戶</h3>

                <!-- 搜尋表單 -->
                <form method="get" action="">
                    <div class="input-group mb-3">
                        <input type="text" name="q" class="form-control" placeholder="輸入用戶名稱" value="{{ query }}">
                        <button class="btn btn-primary" type="submit">搜尋</button>
                    </div>
                </form>

                <!-- 搜尋結果 -->
                {% if results %}
                    <div class="list-group">
                        {% for user in results %}
                            <a href="{% url 'user_profile_detail' username=user.username %}" class="list-group-item list-group-item-action user-item">
                                {{ user.username }} 
                                <span class="badge bg-secondary">{{ user.membership_name }}</span>
                            </a>
                        {% endfor %}
                    </div>
                {% elif query %}
                    <p class="text-center mt-3">沒有找到符合 "{{ query }}" 的用戶</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
