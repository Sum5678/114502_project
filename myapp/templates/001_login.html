<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全防身網站</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #dfffd6;
            margin: 0;
            position: relative;
        }
        .container {
            position: relative;
            width: 80vw;
            height: 80vh;
        }
        .button {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            transform: scale(1.1);
        }
        #logo {
            position: absolute;
            top: 40%;
            left: 45%;
            width: 10%;
            height: 10%;
            background-color: #cfcfcf;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }
    </style>
</head>
<body>


    
    <div class="container">
        <div id="logo">Logo</div>
        <div class="button" style="top: 10%; left: 20%; width: 20%; height: 20%; background-color: #b2f1ff;" onclick="navigate('auto-dial.html')">自動撥號</div>
        <div class="button" style="top: 10%; left: 70%; width: 15%; height: 15%; background-color: #ffb3b3;">登入</div>
        <div class="button" style="top: 30%; left: 80%; width: 15%; height: 15%; background-color: #b0a4ff;" onclick="navigate('chat-room.html')">你的聊天室</div>
        <div class="button" style="top: 70%; left: 70%; width: 35%; height: 25%; background-color: #a4d3ff; border-radius:50%;" onclick="navigate('safety-info.html')">防身小知識 & 線上報案連結</div>
        <div class="button" style="top: 70%; left: 10%; width: 300px; height: 300px; background-color: #ffe599; border-radius: 50%;" onclick="navigate('map.html')">怪人地圖</div>

        <div class="button" style="top: 50%; left: 30%; width: 15%; height: 15%; background-color: #fff2b3;" onclick="navigate('board.html')">公佈欄</div>
        <div class="button" style="top: 10%; left: 50%; width: 10%; height: 10%; background-color: #f3d9ff;" onclick="navigate('settings.html')">個人設定</div>
        <div class="button" style="top: 55%; left: 15%; width: 15%; height: 15%; background-color: #ffdd99;" onclick="navigate('form.html')">我要填表</div>
    </div>

    <script>
        function navigate(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
