<select id="district-select">
  <option value="">請選擇行政區</option>
  <!-- 這裡你可以用 Django 模板語法動態生成 TaiwanRegion 的區域 -->
  <option value="中正區">中正區</option>
  <option value="大安區">大安區</option>
</select>

<div id="map" style="height: 400px; width: 100%;"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap" async defer></script>

<script>
let map;
let markers = [];

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 23.7, lng: 121 },
    zoom: 8,
  });
}

function clearMarkers() {
  markers.forEach(marker => marker.setMap(null));
  markers = [];
}

function addMarkers(policeList) {
  clearMarkers();

  if(policeList.length === 0) {
    alert('此區無警局資料');
    return;
  }

  let bounds = new google.maps.LatLngBounds();

  policeList.forEach(station => {
    let position = { lat: station.latitude, lng: station.longitude };
    let marker = new google.maps.Marker({
      position: position,
      map: map,
      title: station.name,
    });

    let infoWindow = new google.maps.InfoWindow({
      content: `<b>${station.name}</b><br>電話：${station.phone}`
    });

    marker.addListener('click', () => infoWindow.open(map, marker));
    markers.push(marker);
    bounds.extend(position);
  });

  map.fitBounds(bounds);
}

document.getElementById('district-select').addEventListener('change', function() {
  const district = this.value;
  if(!district) return;

  fetch(`/api/police/?district=${encodeURIComponent(district)}`)
    .then(response => response.json())
    .then(data => addMarkers(data))
    .catch(error => console.error('錯誤:', error));
});
</script>
