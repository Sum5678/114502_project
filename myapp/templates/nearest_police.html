<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>最近警局地圖</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>查詢最近警局</h2>
    <form method="get">
        <label>縣市：</label>
        <select name="country_city" onchange="this.form.submit()">
            <option value="">請選擇</option>
            {% for city in countries %}
                <option value="{{ city }}" {% if city == selected_country %}selected{% endif %}>{{ city }}</option>
            {% endfor %}
        </select>

        <label>鄉鎮市區：</label>
        <select name="district_town">
            <option value="">請選擇</option>
            {% for district in districts %}
                <option value="{{ district }}" {% if district == selected_district %}selected{% endif %}>{{ district }}</option>
            {% endfor %}
        </select>

        <button type="submit">確定</button>
    </form>

    {% if police_data %}
        <div id="map"></div>
        {{ police_data|json_script:"policeJson" }}

        <script>
            function initMap() {
                const policeStations = JSON.parse(document.getElementById('policeJson').textContent);

                const center = {
                    lat: parseFloat(policeStations[0].POINT_Y),
                    lng: parseFloat(policeStations[0].POINT_X)
                };

                const map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 13,
                    center: center
                });

                for (const station of policeStations) {
                    const marker = new google.maps.Marker({
                        position: {
                            lat: parseFloat(station.POINT_Y),
                            lng: parseFloat(station.POINT_X)
                        },
                        map: map,
                        title: station.precinct_name
                    });

                    const infoWindow = new google.maps.InfoWindow({
                        content: `<b>${station.precinct_name}</b><br>${station.address}<br>${station.phone}`
                    });

                    marker.addListener('click', () => {
                        infoWindow.open(map, marker);
                    });
                }
            }
        </script>


        <script>
        // 如果 Google Maps 認證失敗會自動呼叫這個函式
        window.gm_authFailure = function() {
            alert('❗ Google Maps 載入失敗！\n請檢查您的 API 金鑰是否正確、是否啟用 Maps JavaScript API，或來源是否允許。');
        };
        </script>

        <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap"></script>
    {% endif %}
</body>
</html>
