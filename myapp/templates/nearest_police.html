<!DOCTYPE html>
<html>
  <head>
    <title>查詢最近警局</title>
    <meta charset="utf-8" />
    <style>
      #controls {
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      select, button {
        padding: 10px;
        font-size: 16px;
      }
      #map {
        height: 80vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <select id="city-select">
        <option value="">選擇縣市</option>
        <option value="台北市">台北市</option>
        <option value="高雄市">高雄市</option>
        <option value="台中市">台中市</option>
      </select>

      <select id="district-select" disabled>
        <option value="">選擇區域</option>
      </select>

      <select id="street-select" disabled>
        <option value="">選擇街道</option>
      </select>

      <button onclick="locateMe()">📍 使用 GPS 查附近警局</button>
    </div>

    <div id="map"></div>

    <script>
      let map;
      let marker;
      let geocoder;
      let placesService;
      const policeMarkers = [];

      const addressData = {
        "台北市": {
          "中正區": ["信義路", "中華路"],
          "大安區": ["復興南路", "敦化南路"],
        },
        "高雄市": {
          "苓雅區": ["中正路", "自強路"],
          "左營區": ["蓮池潭路", "建國路"],
        },
        "台中市": {
          "南區": ["建國北路", "和平路"],
          "北區": ["建國路", "光明路"],
        },
      };

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 23.5, lng: 121 },
          zoom: 7,
        });

        geocoder = new google.maps.Geocoder();
        placesService = new google.maps.places.PlacesService(map);

        document.getElementById("city-select").addEventListener("change", function () {
          const city = this.value;
          const districtSelect = document.getElementById("district-select");
          const streetSelect = document.getElementById("street-select");

          districtSelect.innerHTML = "<option value=''>選擇區域</option>";
          streetSelect.innerHTML = "<option value=''>選擇街道</option>";

          if (city) {
            districtSelect.disabled = false;
            for (let district in addressData[city]) {
              const option = document.createElement("option");
              option.value = district;
              option.text = district;
              districtSelect.appendChild(option);
            }
          } else {
            districtSelect.disabled = true;
            streetSelect.disabled = true;
          }
        });

        document.getElementById("district-select").addEventListener("change", function () {
          const city = document.getElementById("city-select").value;
          const district = this.value;
          const streetSelect = document.getElementById("street-select");

          streetSelect.innerHTML = "<option value=''>選擇街道</option>";

          if (district) {
            streetSelect.disabled = false;
            addressData[city][district].forEach((street) => {
              const option = document.createElement("option");
              option.value = street;
              option.text = street;
              streetSelect.appendChild(option);
            });
          } else {
            streetSelect.disabled = true;
          }
        });

        document.getElementById("street-select").addEventListener("change", function () {
          const city = document.getElementById("city-select").value;
          const district = document.getElementById("district-select").value;
          const street = this.value;
          if (street) {
            const fullAddress = `${city} ${district} ${street}`;
            geocodeAndSearchPolice(fullAddress);
          }
        });
      }

      function geocodeAndSearchPolice(address) {
        geocoder.geocode({ address: address }, (results, status) => {
          if (status === "OK") {
            const location = results[0].geometry.location;
            map.setCenter(location);
            map.setZoom(16);

            if (marker) marker.setMap(null);
            marker = new google.maps.Marker({
              map: map,
              position: location,
            });

            searchNearbyPolice(location);
          } else {
            alert("地址查詢失敗：" + status);
          }
        });
      }

      function locateMe() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const location = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              map.setCenter(location);
              map.setZoom(16);

              if (marker) marker.setMap(null);
              marker = new google.maps.Marker({
                map: map,
                position: location,
                title: "你的位置",
              });

              searchNearbyPolice(location);
            },
            () => {
              alert("無法取得位置，請檢查定位權限");
            }
          );
        } else {
          alert("此瀏覽器不支援 GPS");
        }
      }

      function searchNearbyPolice(location) {
        // 清除舊的警局標記
        policeMarkers.forEach((m) => m.setMap(null));
        policeMarkers.length = 0;

        const request = {
          location: location,
          radius: '2000', // 公尺
          keyword: '警察局',
        };

        placesService.nearbySearch(request, (results, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            results.forEach((place) => {
              const policeMarker = new google.maps.Marker({
                map: map,
                position: place.geometry.location,
                title: place.name,
                icon: {
                  url: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                },
              });
              policeMarkers.push(policeMarker);
            });
          } else {
            alert("找不到附近警局：" + status);
          }
        });
      }
    </script>

    <!-- 替換成你自己的 Google Maps API 金鑰，需啟用 Places API -->
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap">
    </script>
  </body>
</html>
