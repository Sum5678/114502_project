<!DOCTYPE html>
<html>
  <head>
    <title>查詢最近警局</title>
    <meta charset="utf-8" />
    <style>
      #controls {
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      select, button {
        padding: 10px;
        font-size: 16px;
      }
      #map {
        height: 80vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <select id="city-select">
        <option value="">選擇縣市</option>
      </select>

      <select id="district-select" disabled>
        <option value="">選擇區域</option>
      </select>

      <button onclick="locateMe()">📍 使用 GPS 查附近警局</button>
    </div>

    <div id="map"></div>

    <script>
      let map, geocoder, marker;
      let policeMarkers = [];
      let placesService;
      let addressData = {};

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 25.0330, lng: 121.5654 }, // 預設中心點：台北
          zoom: 12,
        });
        geocoder = new google.maps.Geocoder();
        placesService = new google.maps.places.PlacesService(map);
        fetchCityDistrictData();
      }

      async function fetchCityDistrictData() {
        const response = await fetch("/get_city_district_data/");
        addressData = await response.json();

        const citySelect = document.getElementById("city-select");
        citySelect.innerHTML = "<option value=''>選擇縣市</option>";
        for (let city in addressData) {
          const option = document.createElement("option");
          option.value = city;
          option.text = city;
          citySelect.appendChild(option);
        }
      }

      document.getElementById("city-select").addEventListener("change", function () {
        const city = this.value;
        const districtSelect = document.getElementById("district-select");

        districtSelect.innerHTML = "<option value=''>選擇區域</option>";

        if (city && addressData[city]) {
          districtSelect.disabled = false;
          addressData[city].forEach((district) => {
            const option = document.createElement("option");
            option.value = district;
            option.text = district;
            districtSelect.appendChild(option);
          });
        } else {
          districtSelect.disabled = true;
        }
      });

      document.getElementById("district-select").addEventListener("change", function () {
        const city = document.getElementById("city-select").value;
        const district = this.value;
        if (city && district) {
          const fullAddress = `${city} ${district}`;
          geocodeAndSearchPolice(fullAddress);
        }
      });

      function geocodeAndSearchPolice(address) {
        geocoder.geocode({ address: address }, (results, status) => {
          if (status === "OK") {
            const location = results[0].geometry.location;
            map.setCenter(location);
            map.setZoom(16);

            if (marker) marker.setMap(null);
            marker = new google.maps.Marker({
              map: map,
              position: location,
            });

            searchNearbyPolice(location);
          } else {
            alert("地址查詢失敗：" + status);
          }
        });
      }

      function locateMe() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const location = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              map.setCenter(location);
              map.setZoom(16);

              if (marker) marker.setMap(null);
              marker = new google.maps.Marker({
                map: map,
                position: location,
                title: "你的位置",
              });

              searchNearbyPolice(location);
            },
            () => {
              alert("無法取得位置，請檢查定位權限");
            }
          );
        } else {
          alert("此瀏覽器不支援 GPS");
        }
      }

      function searchNearbyPolice(location) {
        policeMarkers.forEach((m) => m.setMap(null));
        policeMarkers.length = 0;

        const request = {
          location: location,
          radius: '2000',
          keyword: '警察局',
        };

        placesService.nearbySearch(request, (results, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            results.forEach((place) => {
              const policeMarker = new google.maps.Marker({
                map: map,
                position: place.geometry.location,
                title: place.name,
                icon: {
                  url: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                },
              });
              policeMarkers.push(policeMarker);
            });
          } else {
            alert("找不到附近警局：" + status);
          }
        });
      }
    </script>

    <script async
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap">
    </script>
  </body>
</html>
