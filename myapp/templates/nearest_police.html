<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>查詢最近的派出所</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>查詢最近的派出所</h1>

    <form method="get">
        縣市：
        <select name="country_city" id="id_country_city">
            <option value="">請選擇縣市</option>
            {% for city in cities %}
                <option value="{{ city }}" {% if city == selected_city %}selected{% endif %}>{{ city }}</option>
            {% endfor %}
        </select>

        行政區：
        <select name="district_town" id="id_district_town">
            {% if selected_city %}
                {% for district in all_regions_json|dictsort:0 %}
                    {% if district.0 == selected_city %}
                        {% for dt in district.1 %}
                            <option value="{{ dt }}" {% if dt == selected_district %}selected{% endif %}>{{ dt }}</option>
                        {% endfor %}
                    {% endif %}
                {% endfor %}
            {% endif %}
        </select>

        <button type="submit">確定</button>
    </form>

    <div id="map"></div>

    <script>
        const regions = {{ all_regions_json|safe }};
        const citySelect = document.getElementById("id_country_city");
        const districtSelect = document.getElementById("id_district_town");

        citySelect.addEventListener("change", function () {
            const selected = this.value;
            const districts = regions[selected] || [];

            districtSelect.innerHTML = "";
            districts.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                districtSelect.appendChild(opt);
            });
        });

        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: { lat: 23.5, lng: 121 },
            });

            const precincts = {{ precincts|safe }};
            precincts.forEach(p => {
                const marker = new google.maps.Marker({
                    position: { lat: p.POINT_Y, lng: p.POINT_X },
                    map: map,
                    title: p.precinct_name,
                });

                const infowindow = new google.maps.InfoWindow({
                    content: `<strong>${p.precinct_name}</strong><br>${p.address}<br>${p.phone}`
                });

                marker.addListener("click", () => {
                    infowindow.open(map, marker);
                });
            });

            if (precincts.length > 0) {
                map.setCenter({ lat: precincts[0].POINT_Y, lng: precincts[0].POINT_X });
            }
        }
    </script>

    <!-- Google Maps API -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap">
    </script>
</body>
</html>
