{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寄送廣告通知信</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>


<body>
  <div class="container my-5">
    <h2>寄送廣告通知信</h2>
    <p><strong>商家名稱：</strong> {{ item.st.store_name }}</p>
    <p><strong>廣告內容：</strong> {{ item.ad_content }}</p>
    <p><strong>方案半徑：</strong> {{ item.ad_radius }} 公尺</p>
    <p><strong>收件者：</strong> {{ to_email }}</p>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="subject" class="form-label">主旨</label>
        <input type="text" class="form-control" id="subject" name="subject" 
               value="關於您的廣告審核與付款通知" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">內容</label>
        <textarea class="form-control" id="message" name="message" rows="6">
尊敬的 {{ item.st.store_name }} 商家您好，

您的廣告申請「{{ item.ad_content }}」已通過審核。

請依照方案半徑 {{ item.ad_radius }} 公尺完成付款，以啟用廣告。

感謝您的配合。
        </textarea>
      </div>

      <button type="submit" class="btn btn-primary">寄送信件</button>
      <a href="{% url 'admin_review_ads' %}" class="btn btn-secondary">返回廣告審核列表</a>
    </form>

  </div>

<script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
