{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ profile.nickname1|default:profile.user.username }} 的公開資料</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">

  <style>
    .profile-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-top: 100px;
    }
    .profile-image {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid #63b3ed;
    }
  </style>
</head>
<body class="index-page">

<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid position-relative d-flex align-items-center justify-content-between">
    <a href="{% url 'home' %}" class="logo d-flex align-items-center me-auto me-xl-0">
      <h1 class="sitename" style="color: #033e6b;">怪怪走開，護您安全</h1>
    </a>
  </div>
</header>

<main class="main">
  <div class="profile-container text-center position-relative" data-aos="fade-up">
    <h2>{{ profile.nickname1|default:profile.user.username }}</h2>
    <img src="{{ profile.avatar_url }}" alt="頭像" class="profile-image">

    {% if profile.intro %}
      <div class="mt-3">
        <h5 class="text-primary">自我介紹</h5>
        <p class="text-muted">{{ profile.intro }}</p>
      </div>
    {% else %}
      <p class="text-muted mt-3">這個使用者還沒有寫自我介紹。</p>
    {% endif %}
  </div>
</main>

<footer id="footer" class="footer position-relative light-background">
  <div class="container copyright text-center mt-4">
    <p>© Copyright <strong class="sitename">怪怪走開</strong> All Rights Reserved</p>
  </div>
</footer>

<script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
<script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>
