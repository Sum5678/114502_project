<!DOCTYPE html>
{% load static %}
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>使用者管理</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="container py-4">

  <h2 class="mb-4">使用者管理</h2>
  <!--<a href="{% url 'user_create' %}" class="btn btn-primary mb-3">新增使用者</a>-->    
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>帳號</th>
        <th>Gmail</th>
        <th>暱稱1</th>
        <th>暱稱2</th>
        <th>緊急電話</th>
        <th>狀態顏色</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.gmail }}</td>
        <td>{{ u.default_nickname1 }}</td>
        <td>{{ u.default_nickname2 }}</td>
        <td>{{ u.emergency_contact_phone }}</td>
        <td>
          {% if u.status_color %}
            <div style="width:20px; height:20px; background-color: {{ u.status_color }}; border:1px solid #000;"></div>
          {% endif %}
        </td>
        <td>
          <a href="{% url 'user_edit' u.id %}" class="btn btn-sm btn-warning">編輯</a>
          <a href="{% url 'user_delete' u.id %}" class="btn btn-sm btn-danger">刪除</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
