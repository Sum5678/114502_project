{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我要發文｜交流區</title>

  <!-- Favicons -->
  <link href="{% static 'assets/img/favicon.png' %}" rel="icon">
  <link href="{% static 'assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Nunito|Poppins" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.0/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- Vendor CSS -->
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">

  <style>
    body {
      background-color: #fff;
      padding-top: 100px;
      font-family: "Microsoft JhengHei", sans-serif;
    }
    .form-container {
      background: #fff;
      padding: 25px 30px;
      border: 1px solid #d9e8f4;
      border-radius: 10px;
      margin-top: 40px;
    }
    label {
      margin-top: 20px;
      font-weight: 500;
      color: #033e6b;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1.5px solid #c4ddf6;
      border-radius: 6px;
      font-size: 15px;
      background-color: #fff;
    }
    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      background-color: #63b3ed;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
    }
    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }
    .avatar-preview img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #a7d8ff;
      background-color: #f0faff;
      object-fit: cover;
    }
    .color-options {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #cbdff1;
    }
    .color-swatch.selected {
      border-color: #4299e1;
      box-shadow: 0 0 8px 1px #a8cdfd;
    }
  </style>
</head>
<body>

<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid position-relative d-flex align-items-center justify-content-between">
    <a href="{% url 'home' %}" class="logo d-flex align-items-center me-auto me-xl-0">
      <h1 class="sitename" style="color: #033e6b;">怪怪走開，護您安全</h1>
    </a>
    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="{% url 'home' %}#hero" class="active">主頁</a></li>
        <li><a href="{% url 'home' %}#services" class="active">簡介及功能介紹</a></li>
        <li><a href="{% url 'report' %}" class="active">填寫表單</a></li>
        <li><a href="{% url 'business_upload' %}" class="active">商家填單</a></li>
        <li><a href="{% url 'post' %}" class="active">我要發文</a></li>
        <li><a href="{% url 'map' %}" class="active">事件地圖</a></li>
        <li><a href="{% url 'harassment_prevention' %}" class="active">防騷指南</a></li>
      </ul>
      <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
    </nav>
    {% if request.user.is_authenticated %}
      <a class="btn-getstarted" href="{% url '01_userlogin_out' %}">登出</a>
    {% else %}
      <a class="btn-getstarted" href="{% url 'userlogin' %}">登入</a>
    {% endif %}
  </div>
</header>

<main class="main">
  <!-- ✅ 已移除圖片區塊 -->

  <!-- 發文表單區塊 -->
  <section class="container">
    <div class="form-container">
      <h2 class="mb-4">我要發文｜交流區</h2>
      <form method="post" action="{% url 'post' %}">
        {% csrf_token %}
        <input type="hidden" name="nickname" value="匿名">
        <label>選擇背景顏色</label>
        <div class="color-options" id="colorOptions">
          <div class="color-swatch" style="background:#f44336" onclick="setBgColor('f44336', this)"></div>
          <div class="color-swatch" style="background:#2196f3" onclick="setBgColor('2196f3', this)"></div>
          <div class="color-swatch" style="background:#4caf50" onclick="setBgColor('4caf50', this)"></div>
          <div class="color-swatch" style="background:#ff9800" onclick="setBgColor('ff9800', this)"></div>
          <div class="color-swatch" style="background:#9c27b0" onclick="setBgColor('9c27b0', this)"></div>
        </div>
        <input type="hidden" name="bgcolor" id="bgcolor" value="2196f3">

        <label>選擇頭像風格</label>
        <select id="avatarStyle" name="avatar_style" onchange="updateAvatar()">
          <option value="avataaars">漫畫風</option>
          <option value="pixel-art">像素風</option>
          <option value="bottts">機器人風</option>
          <option value="adventurer">3D風</option>
        </select>

        <div class="avatar-preview">
          <img id="avatar" src="" alt="預覽頭像">
          <span id="nickname-label">匿名</span>
        </div>

        <label for="title">文章標題</label>
        <input type="text" id="title" name="title" placeholder="請輸入標題" required>

        <label for="content">文章內容</label>
        <textarea id="content" name="content" rows="6" placeholder="請輸入文章內容" required></textarea>

        <button type="submit">送出發文</button>
      </form>
    </div>
  </section>
</main>

<footer class="footer text-center mt-5 py-4 bg-light">
  <p>&copy; 2025 怪怪走開，護您安全｜Append Template</p>
</footer>

<script>
  let bgColor = "2196f3";
  function setBgColor(color, elem) {
    bgColor = color;
    updateAvatar();
    document.getElementById("bgcolor").value = color;
    document.querySelectorAll('.color-swatch').forEach(e => e.classList.remove('selected'));
    if (elem) elem.classList.add('selected');
  }
  function updateAvatar() {
    const nickname = "匿名";
    const style = document.getElementById("avatarStyle").value;
    const avatarUrl = `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(nickname)}&backgroundColor=${bgColor}`;
    document.getElementById("avatar").src = avatarUrl;
    document.getElementById("nickname-label").innerText = nickname;
  }
  window.onload = () => {
    const defaultColorElem = document.querySelector('.color-swatch[style*="2196f3"]');
    if (defaultColorElem) defaultColorElem.classList.add('selected');
    updateAvatar();
  };
</script>

<script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>
