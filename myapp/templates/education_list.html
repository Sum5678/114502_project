{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教育資源管理介面</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f8ff;
            padding: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .img-button {
            width: 260px;
            height: 240px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            border: none;
            position: relative;
        }
        .card {
            position: relative;
        }
        .card .actions {
            margin-top: 8px;
        }
        .actions a {
            margin: 0 5px;
            color: #007BFF;
            text-decoration: none;
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .create-btn {
            margin: 20px;
            display: inline-block;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>教育資源管理介面</h1>
    <a href="{% url 'education_create' %}" class="create-btn">➕ 新增資源</a>
    <div class="button-container">
        {% for page in pages %}
        <div class="card">
            <a href="{{ page.url }}" target="_blank">
                <div class="img-button"
                     style="background-image: url('{% url 'education_image' page.id %}');">
                </div>
            </a>
            <p>{{ page.title }}</p>
            <div class="actions">
                <a href="{% url 'education_update' page.id %}">✏️ 編輯</a>
                <a href="{% url 'education_delete' page.id %}">🗑 刪除</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
