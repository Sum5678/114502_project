<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理員登入</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #036;
      margin-bottom: 20px;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #033e6b;
    }

    form input[type="email"],
    form input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 5px;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2c80b4;
    }

    .error {
      margin-top: 10px;
      padding: 10px;
      background-color: #fce4ec;
      border: 1px solid #f48fb1;
      color: #c2185b;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>管理員登入</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'admin_login' %}">
      {% csrf_token %}

      <label for="admin_gmail">Email</label>
      <input type="email" id="admin_gmail" name="admin_gmail" required>

      <label for="password">密碼</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">登入</button>
    </form>

    <div class="register-link">
      還沒有帳號嗎？<a href="{% url 'admin_register' %}">註冊管理員</a>
    </div>
    
  </div>
</body>
</html>
