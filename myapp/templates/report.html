{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回報可疑事件</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>

<body class="index-page">

  <!-- Header -->
  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between">
      <a href="{% url 'admin_index' %}" class="logo d-flex flex-column align-items-start me-auto me-xl-0">
        <h1 class="sitename">{{ admin_name }} 管理員</h1>
        <h1 class="sitename">您的管理員id是: {{ admin_id }}</h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="{% url 'admin_index' %}#hero" class="active">管理員主頁</a></li>
          <li><a href="{% url 'admin_interview' %}">管理員自我介紹</a></li>
          <li><a href="{% url 'show_judge_page' %}">審核表單</a></li>
          <li><a href="{% url 'pemap_judge' %}">事件清單審核</a></li>
          <li><a href="{% url 'admin_logout' %}">登出</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>
      <a class="btn-getstarted" href="{% url 'admin_logout' %}">登出</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" style="padding-top: 100px;">
    <!-- Report Form Section -->
    <section id="report" class="report section">
      <div class="container" data-aos="fade-up">
        <div class="section-title">
          <h2>我要填單</h2>
          <p>請回報你在街道上遇到的可疑事件，幫助更多人提高警覺。</p>
        </div>

        <form id="report-form" enctype="multipart/form-data" method="post">
          {% csrf_token %}
          <div class="row gy-3">
            <!-- 顯示名稱 -->
            <div class="col-md-6">
              <label for="display_name" class="form-label">姓名</label>
              <input type="text" class="form-control" id="display_name" name="display_name" placeholder="可填匿名">
            </div>

            <!-- Gmail -->
            <div class="col-md-6">
              <label for="email" class="form-label">Gmail</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="yourmail@gmail.com">
            </div>

            <!-- 事件分類 -->
            <div class="col-md-6">
              <label for="kind" class="form-label">可疑性質</label>
              <select class="form-select" id="kind" name="kind" required>
                <option selected disabled>請選擇</option>
                <option value="騷擾">騷擾</option>
                <option value="打架">打架</option>
                <option value="動物">動物</option>
                <option value="環境髒亂">環境髒亂</option>
              </select>
            </div>

            <!-- 詳細分類 -->
            <div class="col-md-6">
              <label for="subkind" class="form-label">詳細分類</label>
              <select class="form-select" id="subkind" name="subkind" required>
                <option selected disabled>請先選擇上方分類</option>
              </select>
            </div>

            <!-- 地點 + 地圖 -->
            <div class="col-12">
              <label for="address" class="form-label">地點</label>
              <input type="text" class="form-control" id="address" name="address" placeholder="請點選地圖" readonly>
              <input type="hidden" id="latitude" name="latitude">
              <input type="hidden" id="longitude" name="longitude">
              <div id="map" style="height: 300px; margin-top: 10px;"></div>
            </div>

            <!-- 說明 -->
            <div class="col-12">
              <label for="reason" class="form-label">說明</label>
              <textarea class="form-control" id="reason" name="reason" rows="3" placeholder="請描述發生的情況"></textarea>
            </div>

            <!-- 圖片上傳 -->
            <div class="col-12">
              <label for="image" class="form-label">上傳圖片（可選）</label>
              <input class="form-control" type="file" id="image" name="image" accept="image/*">
              <img id="preview" style="margin-top: 10px; max-height: 200px; display: none;" />
            </div>

            <!-- 匿名勾選 -->
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="anonymous" name="anonymous" checked>
                <label class="form-check-label" for="anonymous">匿名提交</label>
              </div>
            </div>

            <!-- 送出 -->
            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary">送出回報</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer" class="footer position-relative light-background">
    <div class="container copyright text-center mt-4">
      <p>© <span>Copyright</span> <strong class="sitename">Append</strong> <span>All Rights Reserved</span></p>
      <div class="credits">Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a></div>
    </div>
  </footer>

  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
  </a>
  <div id="preloader"></div>

  <!-- Leaflet + Template Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>
  <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
  <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'assets/vendor/purecounter/purecounter_vanilla.js' %}"></script>
  <script src="{% static 'assets/vendor/imagesloaded/imagesloaded.pkgd.min.js' %}"></script>
  <script src="{% static 'assets/vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
  <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>

  <!-- Custom Script -->
  <script>
    const map = L.map('map').setView([25.033964, 121.564472], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap 貢獻者'
    }).addTo(map);
    let marker;
    map.on('click', function (e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      document.getElementById('latitude').value = lat;
      document.getElementById('longitude').value = lng;
      document.getElementById('address').value = `${lat}, ${lng}`;
      if (marker) {
        marker.setLatLng(e.latlng);
      } else {
        marker = L.marker(e.latlng).addTo(map);
      }
    });

    document.getElementById('image').addEventListener('change', function (event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview');
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.src = '';
        preview.style.display = 'none';
      }
    });

    const subkindOptions = {
      "騷擾": ["推銷", "暴露狂", "跟蹤", "言語騷擾", "拍攝他人", "擋路糾纏", "其他"],
      "打架": ["肢體衝突", "口角爭執", "幫派鬥毆", "攻擊路人", "其他"],
      "動物": ["咬人", "無人看管寵物", "攻擊性動物", "受傷動物", "野生動物闖入", "其他"],
      "環境髒亂": ["公共財物破壞", "可疑物品", "垃圾堆積", "噪音擾人", "惡臭", "噴漆塗鴉", "其他"]
    };

    document.getElementById('kind').addEventListener('change', function () {
      const kind = this.value;
      const subkindSelect = document.getElementById('subkind');
      subkindSelect.innerHTML = "";
      if (subkindOptions[kind]) {
        subkindOptions[kind].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subkindSelect.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.textContent = "請先選擇上方分類";
        opt.disabled = true;
        subkindSelect.appendChild(opt);
      }
    });
  </script>

</body>
</html>
