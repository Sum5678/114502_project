<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的回報紀錄</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #036;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #d6ecf9;
      color: #033e6b;
    }

    tr:hover {
      background-color: #f2faff;
    }

    .status-btn {
      padding: 6px 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .status-btn:hover {
      background-color: #2c80b4;
    }

    .back-button {
      margin-top: 20px;
      text-align: center;
    }

    .back-button button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-button button:hover {
      background-color: #2c80b4;
    }

    img.report-image {
      max-width: 100px;
      max-height: 100px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>我的回報紀錄</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>顯示名稱</th>
          <th>類別</th>
          <th>原因</th>
          <th>地址</th>
          <th>圖片</th>
          <th>上傳時間</th>
          <th>審核狀態</th>
        </tr>
      </thead>
      <tbody>
        {% for report in reports %}
        <tr>
          <td>{{ report.reverse_id }}</td>
          <td>{{ report.display_name }}</td>
          <td>{{ report.kind }}</td>
          <td>{{ report.reason }}</td>
          <td>{{ report.address }}</td>
          <td>
            {% if report.img_url %}
              <img src="{{ report.img_url }}" alt="圖片" class="report-image">
            {% else %}
              無圖片
            {% endif %}
          </td>
          <td>{{ report.time_created }}</td>
          <td>{{ report.review_status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="back-button">
      <button onclick="location.href='profile.html'">返回個人頁面</button>
    </div>
  </div>
</body>
</html>
