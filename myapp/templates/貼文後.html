<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>交流區文章展示</title>
  <style>
    /* 全局 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9fbfc;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: #444;
      user-select: none;
    }

    /* 文章主容器 */
    .container {
      max-width: 900px;
      width: 100%;
      background: #fff;
      padding: 30px 40px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      user-select: text;
    }

    /* 頁面標題 */
    h1 {
      text-align: center;
      color: #2a3a5f;
      margin-top: 0;
      margin-bottom: 40px;
      font-weight: 700;
      letter-spacing: 0.05em;
      user-select: none;
    }

    /* 單篇文章區塊 */
    .post {
      display: flex;
      gap: 18px;
      padding: 20px 25px;
      border-radius: 14px;
      background: #fefefe;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      margin-bottom: 22px;
      transition: box-shadow 0.3s ease;
    }
    .post:last-child {
      margin-bottom: 0;
    }
    .post:hover {
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
    }

    /* 頭像區 */
    .avatar {
      flex-shrink: 0;
      user-select: none;
    }
    .avatar img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #f3f6fb;
      border: 2px solid #d8e1f1;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    .avatar img:hover {
      border-color: #4a5cae;
      box-shadow: 0 4px 14px rgba(74, 92, 174, 0.25);
    }

    /* 內容區 */
    .post-content-box {
      flex-grow: 1;
      user-select: text;
    }

    /* 文章標題 */
    .post-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #2a3a5f;
      user-select: text;
      letter-spacing: 0.02em;
    }

    /* 發佈資訊 */
    .post-meta {
      font-size: 13px;
      color: #7a8299;
      margin-bottom: 12px;
      user-select: text;
    }

    /* 文章內容 */
    .post-content {
      font-size: 16px;
      line-height: 1.7;
      color: #555;
      white-space: pre-wrap;
      user-select: text;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>交流區文章展示</h1>

    <div class="post">
      <div class="avatar">
        <img src="https://i.pravatar.cc/100?u=匿名A" alt="匿名頭像" />
      </div>
      <div class="post-content-box">
        <div class="post-title">深夜遇到拿洋蔥的人？</div>
        <div class="post-meta" data-time="2025-05-20T23:12:34">由 匿名 發佈 ｜ </div>
        <div class="post-content">昨晚十一點走回宿舍的路上，一個男子突然靠近我，手上拿著一顆洋蔥，問我「妳相信洋蔥能改變命運嗎？」我當下只想逃跑，太詭異了啦！</div>
      </div>
    </div>

    <div class="post">
      <div class="avatar">
        <img src="https://i.pravatar.cc/100?u=小明" alt="小明頭像" />
      </div>
      <div class="post-content-box">
        <div class="post-title">公車上的騷擾事件</div>
        <div class="post-meta" data-time="2025-05-19T14:35:02">由 小明 發佈 ｜ </div>
        <div class="post-content">今天搭公車時，一個中年男子靠我超近，不斷試圖搭話，還說「學生就是青春洋溢啊」。我移開後他還笑著說「不要害羞」。真的很不舒服，司機也沒處理。</div>
      </div>
    </div>

    <div class="post">
      <div class="avatar">
        <img src="https://i.pravatar.cc/100?u=暱稱001" alt="暱稱001頭像" />
      </div>
      <div class="post-content-box">
        <div class="post-title">圖書館被騷擾了</div>
        <div class="post-meta" data-time="2025-05-18T09:50:11">由 暱稱001 發佈 ｜ </div>
        <div class="post-content">昨天在圖書館自習，一位陌生男生突然坐到我對面，開始不斷問我讀哪科、是不是單身。我冷回應他還不走，真的希望大家注意安全。</div>
      </div>
    </div>
  </div>

  <script>
    // 自動將 data-time 格式化並顯示在 post-meta 內
    document.querySelectorAll('.post-meta').forEach(meta => {
      const timeString = meta.getAttribute('data-time');
      if (timeString) {
        const date = new Date(timeString);
        const y = date.getFullYear();
        const m = (date.getMonth() + 1).toString().padStart(2, '0');
        const d = date.getDate().toString().padStart(2, '0');
        const hh = date.getHours().toString().padStart(2, '0');
        const mm = date.getMinutes().toString().padStart(2, '0');
        const ss = date.getSeconds().toString().padStart(2, '0');
        meta.textContent += `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
      }
    });
  </script>
</body>
</html>
