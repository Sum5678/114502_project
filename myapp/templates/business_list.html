<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>商家上傳紀錄</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4faff;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #dceefc;
      color: #333;
    }

    tr:hover {
      background-color: #f2faff;
    }

    .action-btn {
      padding: 6px 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .action-btn:hover {
      background-color: #2c80b4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>商家上傳紀錄</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>商家店名</th>
          <th>營業時間</th>
          <th>地址</th>
          <th>電話</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="businessTableBody">
        <!-- 資料由 JavaScript 插入 -->
      </tbody>
    </table>
  </div>

  <script>
    const tableBody = document.getElementById("businessTableBody");
    const businesses = JSON.parse(localStorage.getItem("businesses")) || [];

    businesses.forEach((b, i) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i + 1}</td>
        <td>${b.bs_name}</td>
        <td>${b.bs_time}</td>
        <td>${b.bs_address}</td>
        <td>${b.bs_phone}</td>
        <td><button class="action-btn" onclick="location.href='business_review.html'">查看</button></td>
      `;
      tableBody.appendChild(row);
    });
  </script>
</body>
</html>
