<!DOCTYPE html>
{% load static %}
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>編輯用戶狀態</title>
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">編輯用戶狀態顏色</h2>

    <div class="card shadow p-4">
      <form method="POST">
        {% csrf_token %}
        <!-- User Image -->
        <div class="text-center">
          {% if user.user_images %}
            <div id="user-image-border" 
                class="d-inline-block rounded-circle" 
                style="border: 5px solid {{ user.status_color }};">
              <img src="{{ user.user_images }}" 
                  alt="User Image" 
                  class="rounded-circle shadow-sm" 
                  style="width: 200px; height: 200px; object-fit: cover;">
            </div>
          {% else %}
            <p class="text-muted">尚未上傳圖片</p>
          {% endif %}
        </div>

        <!-- 其他資訊 (唯讀) -->
        <div class="mb-3">
          <label class="form-label">用戶 ID</label>
          <input type="text" class="form-control" value="{{ user.id }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">使用者名稱</label>
          <input type="text" class="form-control" value="{{ user.username }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">Gmail</label>
          <input type="text" class="form-control" value="{{ user.gmail }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">預設暱稱1</label>
          <input type="text" class="form-control" value="{{ user.default_nickname1 }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">預設暱稱2</label>
          <input type="text" class="form-control" value="{{ user.default_nickname2 }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">緊急聯絡電話</label>
          <input type="text" class="form-control" value="{{ user.emergency_contact_phone }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">緊急聯絡 Gmail</label>
          <input type="text" class="form-control" value="{{ user.emergency_contact_gmail }}" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label">預設訊息</label>
          <textarea class="form-control" rows="2" readonly>{{ user.default_message }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">自我介紹</label>
          <textarea class="form-control" rows="3" readonly>{{ user.self_intro }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">建立時間</label>
          <input type="text" class="form-control" value="{{ user.created_at }}" readonly>
        </div>

        <!-- 可編輯狀態顏色 -->
        <div class="mb-3 mt-3">
          <label class="form-label">狀態顏色</label>
          <select class="form-select" name="status_color" id="status-select">
            <option value="#63b3ed" {% if user.status_color == "#63b3ed" %}selected{% endif %}>正常</option>
            <option value="#f2e57e" {% if user.status_color == "#f2e57e" %}selected{% endif %}>警示</option>
            <option value="#f76579" {% if user.status_color == "#f76579" %}selected{% endif %}>危險</option>
          </select>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{% url 'user_admin_list' %}" class="btn btn-secondary">返回</a>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 監聽下拉式選單變化，改變外框顏色
    document.getElementById('status-select').addEventListener('change', function () {
      var borderDiv = document.getElementById('user-image-border');
      if (borderDiv) {
        borderDiv.style.borderColor = this.value;
      }
    });
  </script>
</body>
</html>
