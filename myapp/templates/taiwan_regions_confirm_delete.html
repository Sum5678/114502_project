{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>確認刪除</h2>
    <p>你確定要刪除這筆資料嗎？</p>
    <ul>
        <li><strong>縣市：</strong>{{ region.county_city }}</li>
        <li><strong>鄉鎮市區：</strong>{{ region.district_town }}</li>
    </ul>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">確認刪除</button>
        <a href="{% url 'taiwan_regions_list' %}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
