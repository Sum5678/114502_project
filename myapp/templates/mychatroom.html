<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>我的聊天室</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #e0e0e0;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .chat-list button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    .chat-list button:hover {
      background-color: #d0d0d0;
    }

    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      background-color: #ffffff;
    }

    .chat-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .chat-box {
      flex-grow: 1;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }

    .chat-message {
      margin-bottom: 8px;
    }

    .chat-input {
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .chat-input button {
      padding: 10px 16px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>聊天室列表</h2>
    <div class="chat-list">
      <button onclick="switchChat('朋友A')">朋友A</button>
      <button onclick="switchChat('同事B')">同事B</button>
      <button onclick="switchChat('同學C')">同學C</button>
    </div>
  </div>
  <div class="chat-area">
    <div class="chat-title" id="chat-title">選擇聊天室開始聊天</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="輸入訊息...">
      <button onclick="sendMessage()">發送</button>
    </div>
  </div>
</div>

<script>
  const chatData = {
    "朋友A": [],
    "同事B": [],
    "同學C": []
  };

  let currentChat = "";

  function switchChat(name) {
    currentChat = name;
    document.getElementById("chat-title").textContent = "與 " + name + " 的對話";
    renderMessages();
  }

  function sendMessage() {
    const input = document.getElementById("chat-input");
    const message = input.value.trim();
    if (!message || !currentChat) return;

    chatData[currentChat].push({ sender: "你", text: message });
    input.value = "";
    renderMessages();
  }

  function renderMessages() {
    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML = "";
    const messages = chatData[currentChat] || [];

    messages.forEach(msg => {
      const p = document.createElement("p");
      p.className = "chat-message";
      p.textContent = `${msg.sender}: ${msg.text}`;
      chatBox.appendChild(p);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
