<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 100%;
      background-color: #333;
      color: white;
      padding-top: 80px;
    }
    .sidebar div {
      padding: 15px 20px;
      cursor: pointer;
    }
    .sidebar .active {
      background-color: #4debd2;
      color: black;
    }
    .topbar {
      position: fixed;
      top: 0;
      left: 200px;
      right: 0;
      height: 60px;
      background-color: #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 24px;
      color: #555;
    }
    .user-box {
      background-color: #b8dfff;
      padding: 5px 10px;
      border-radius: 5px;
    }
    .main {
      margin-left: 200px;
      margin-top: 60px;
      padding: 20px;
      background-color: #ddd;
      height: calc(100vh - 60px);
    }
    .content-box {
      background-color: #eee;
      padding: 20px;
      border: 2px solid #ccc;
    }
    .content-box input, .content-box textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 18px;
    }
    .content-box textarea {
      height: 200px;
      font-size: 24px;
      text-align: center;
    }
    .buttons {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .send-btn {
      background-color: #4caf50;
      color: white;
    }
    .back-btn {
      background-color: #4caf50;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>審核表單</div>
    <div class="active">用戶管理</div>
    <div>管理員資料</div>
  </div>

  <div class="topbar">
    <h1>ADMIN</h1>
    <div class="user-box">USER XXX</div>
  </div>

  <div class="main">
    <div class="content-box">
      <label for="receiver">傳送至：</label>
      <input type="email" id="receiver" placeholder="輸入收件人 Gmail" required />

      <textarea placeholder="打字內容 OR 公文"></textarea>

      <div class="buttons">
        <button class="send-btn">傳送</button>
        <button class="back-btn">返回</button>
      </div>
    </div>
  </div>
</body>
</html>
