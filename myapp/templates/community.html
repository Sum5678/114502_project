<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>我要發文｜交流區</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      padding: 30px 15px;
      color: #333;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .scale-wrapper {
      transform: scale(0.75);
      transform-origin: top center;
      width: 100%;
      max-width: none;
      margin: 0;
    }
    .form-container {
      max-width: 100%;
      background: #fff;
      padding: 25px 30px;
      border: 1px solid #e0e0e0;
    }
    h2 {
      text-align: center;
      font-weight: 600;
      color: white;
      background-color: rgb(58, 146, 217);
      padding: 12px 0;
      margin-bottom: 25px;
      letter-spacing: 0.03em;
      user-select: none;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 500;
      color: #555;
      letter-spacing: 0.02em;
    }
    select, input, textarea {
      width: 100%;
      padding: 12px 15px;
      margin-top: 8px;
      border: 1.5px solid #d3d3d3;
      font-size: 15px;
      color: #444;
      background-color: #fafafa;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #80bfff;
      background-color: #fff;
      outline: none;
    }
    button {
      margin-top: 30px;
      padding: 14px 0;
      width: 100%;
      background-color: #80bfff;
      color: #fff;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
      letter-spacing: 0.03em;
    }
    button:hover {
      background-color: #5a9dea;
    }
    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }
    .avatar-preview img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #cfd8dc;
      background-color: #f0f4f8;
      object-fit: cover;
      transition: border-color 0.2s ease;
    }
    .avatar-preview img:hover {
      border-color: #80bfff;
    }
    #nickname-label {
      font-weight: 500;
      font-size: 17px;
      color: #666;
      user-select: none;
    }
    .color-options {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #d3d3d3;
      transition: border-color 0.2s ease;
    }
    .color-swatch:hover {
      border-color: #80bfff;
    }
    .color-swatch.selected {
      border-color: #5a9dea;
      box-shadow: 0 0 8px 1px #a8cdfd;
    }
    .style-select {
      margin-top: 10px;
      padding: 11px 15px;
      border: 1.5px solid #d3d3d3;
      font-size: 15px;
      background-color: #fafafa;
      color: #444;
      box-sizing: border-box;
    }
    .style-select:focus {
      border-color: #80bfff;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="scale-wrapper">
    <div class="form-container">
      <h2>我要發文</h2>
      <form>
        <label for="nickname">發文名稱（請選擇你的暱稱）</label>
        <select id="nickname" onchange="updateAvatar()">
          <option value="匿名">匿名</option>
          <option value="小明">小明</option>
          <option value="阿華">阿華</option>
          <option value="Sunny">Sunny</option>
        </select>

        <label>選擇背景顏色</label>
        <div class="color-options" id="colorOptions">
          <div class="color-swatch" style="background:#f44336" onclick="setBgColor('f44336', this)"></div>
          <div class="color-swatch" style="background:#2196f3" onclick="setBgColor('2196f3', this)"></div>
          <div class="color-swatch" style="background:#4caf50" onclick="setBgColor('4caf50', this)"></div>
          <div class="color-swatch" style="background:#ff9800" onclick="setBgColor('ff9800', this)"></div>
          <div class="color-swatch" style="background:#9c27b0" onclick="setBgColor('9c27b0', this)"></div>
        </div>

        <label>選擇頭像風格</label>
        <select id="avatarStyle" class="style-select" onchange="updateAvatar()">
          <option value="avataaars">漫畫風</option>
          <option value="pixel-art">像素風</option>
          <option value="bottts">機器人風</option>
          <option value="adventurer">3D風</option>
        </select>

        <div class="avatar-preview">
          <img id="avatar" src="" alt="預覽頭像" />
          <span id="nickname-label">匿名</span>
        </div>

        <label for="title">文章標題</label>
        <input type="text" id="title" placeholder="請輸入標題" />

        <label for="content">文章內容</label>
        <textarea id="content" rows="6" placeholder="請輸入文章內容"></textarea>

        <button type="button" onclick="alert('文章已送出，等待審核')">送出發文</button>
      </form>
    </div>
  </div>

  <script>
    let bgColor = "2196f3";

    function setBgColor(color, elem) {
      bgColor = color;
      updateAvatar();

      document.querySelectorAll('.color-swatch').forEach(e => e.classList.remove('selected'));
      if (elem) elem.classList.add('selected');
    }

    function updateAvatar() {
      const nickname = document.getElementById("nickname").value || "匿名";
      const style = document.getElementById("avatarStyle").value;
      const avatarUrl = `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(nickname)}&backgroundColor=${bgColor}`;

      document.getElementById("avatar").src = avatarUrl;
      document.getElementById("nickname-label").innerText = nickname;
    }

    window.onload = () => {
      const defaultColorElem = document.querySelector('.color-swatch[style*="2196f3"]');
      if (defaultColorElem) defaultColorElem.classList.add('selected');
      updateAvatar();
    };
  </script>
</body>
</html>
