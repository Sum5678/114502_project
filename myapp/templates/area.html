<!DOCTYPE html>
<html>
  <head>
    <title>地址選擇地圖</title>
    <meta charset="utf-8" />
    <style>
      #controls {
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      select, button {
        padding: 10px;
        font-size: 16px;
      }
      #map {
        height: 80vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <select id="city-select">
        <option value="">選擇縣市</option>
        <option value="台北市">台北市</option>
        <option value="高雄市">高雄市</option>
        <option value="台中市">台中市</option>
        <option value="新北市">新北市</option>
        <option value="台南市">台南市</option>
        <option value="基隆市">基隆市</option>
        <option value="新竹市">新竹市</option>
        <option value="桃園市">桃園市</option>
        <option value="屏東縣">屏東縣</option>
        <option value="宜蘭縣">宜蘭縣</option>
        <option value="花蓮縣">花蓮縣</option>
        <option value="台東縣">台東縣</option>
        <option value="南投縣">南投縣</option>
        <option value="彰化縣">彰化縣</option>
        <option value="雲林縣">雲林縣</option>
        <option value="金門縣">金門縣</option>
        <option value="澎湖縣">澎湖縣</option>
        <option value="苗栗縣">苗栗縣</option>
      </select>

      <select id="district-select" disabled>
        <option value="">選擇區域</option>
      </select>

      <select id="street-select" disabled>
        <option value="">選擇街道</option>
      </select>

      <button onclick="locateMe()">📍 使用 GPS 取得目前位置</button>
    </div>

    <div id="map"></div>

    <script>
      let map;
      let marker;
      let geocoder;

      const addressData = {
        "台北市": {
          "中正區": ["信義路", "中華路"],
          "大安區": ["復興南路", "敦化南路"],
        },
        "高雄市": {
          "苓雅區": ["中正路", "自強路"],
          "左營區": ["蓮池潭路", "建國路"],
        },
        "台中市": {
          "南區": ["建國北路", "和平路"],
          "北區": ["建國路", "光明路"],
        },
        "新北市": {
          "板橋區": ["中山路", "文化路"],
          "新莊區": ["建國路", "福崗路"],
          "三重區": ["重新路", "中正北路"],
          "樹林區": ["樹林路", "中山路"],
        },
        "台南市": {
          "中西區": ["國華街", "府前路"],
          "東區": ["仁愛路", "崇德路"],
        },
        "基隆市": {
          "仁愛區": ["中正路", "和平路"],
          "信義區": ["建國路", "東岸路"],
        },
        "新竹市": {
          "東區": ["光復路", "民族路"],
          "北區": ["光華街", "民生路"],
        },
        "桃園市": {
          "桃園區": ["中華路", "民權路"],
          "中壢區": ["中央路", "自強路"],
        },
        "屏東縣": {
          "屏東市": ["復興路", "建國路"],
          "東港鎮": ["東港路", "永安街"],
        },
        "宜蘭縣": {
          "宜蘭市": ["中山路", "復興路"],
          "羅東鎮": ["中華路", "民族路"],
        },
        "花蓮縣": {
          "花蓮市": ["中華路", "建國路"],
          "吉安鄉": ["吉安路", "文衡路"],
        },
        "台東縣": {
          "台東市": ["中華路", "建國路"],
          "成功鎮": ["成功路", "中華路"],
        },
        "南投縣": {
          "南投市": ["中興路", "南投路"],
          "草屯鎮": ["草屯路", "南投路"],
        },
        "彰化縣": {
          "彰化市": ["中華路", "民生路"],
          "員林市": ["員林路", "大同路"],
        },
        "雲林縣": {
          "斗六市": ["文化路", "中央路"],
          "虎尾鎮": ["虎尾路", "建國路"],
        },
        "金門縣": {
          "金城鎮": ["金城路", "和平路"],
          "金湖鎮": ["金湖路", "建國路"],
        },
        "澎湖縣": {
          "馬公市": ["民生路", "長樂路"],
          "湖西鄉": ["湖西路", "環湖路"],
        },
        "苗栗縣": {
          "苗栗市": ["中正路", "建國路"],
          "苑裡鎮": ["苑裡路", "建國路"],
        }
      };

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 23.5, lng: 121 },
          zoom: 7,
        });

        geocoder = new google.maps.Geocoder();

        document.getElementById("city-select").addEventListener("change", function () {
          const city = this.value;
          const districtSelect = document.getElementById("district-select");
          const streetSelect = document.getElementById("street-select");

          districtSelect.innerHTML = "<option value=''>選擇區域</option>";
          streetSelect.innerHTML = "<option value=''>選擇街道</option>";

          if (city) {
            districtSelect.disabled = false;
            for (let district in addressData[city]) {
              const option = document.createElement("option");
              option.value = district;
              option.text = district;
              districtSelect.appendChild(option);
            }
          } else {
            districtSelect.disabled = true;
            streetSelect.disabled = true;
          }
        });

        document.getElementById("district-select").addEventListener("change", function () {
          const city = document.getElementById("city-select").value;
          const district = this.value;
          const streetSelect = document.getElementById("street-select");

          streetSelect.innerHTML = "<option value=''>選擇街道</option>";

          if (district) {
            streetSelect.disabled = false;
            addressData[city][district].forEach((street) => {
              const option = document.createElement("option");
              option.value = street;
              option.text = street;
              streetSelect.appendChild(option);
            });
          } else {
            streetSelect.disabled = true;
          }
        });

        document.getElementById("street-select").addEventListener("change", function () {
          const city = document.getElementById("city-select").value;
          const district = document.getElementById("district-select").value;
          const street = this.value;
          if (street) {
            const fullAddress = `${city} ${district} ${street}`;
            geocodeAddress(fullAddress);
          }
        });
      }

      function geocodeAddress(address) {
        geocoder.geocode({ address: address }, (results, status) => {
          if (status === "OK") {
            const location = results[0].geometry.location;
            map.setCenter(location);
            map.setZoom(16);

            if (marker) marker.setMap(null);
            marker = new google.maps.Marker({
              map: map,
              position: location,
            });
          } else {
            alert("地址查詢失敗：" + status);
          }
        });
      }

      function locateMe() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const location = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };

              map.setCenter(location);
              map.setZoom(16);

              if (marker) marker.setMap(null);
              marker = new google.maps.Marker({
                map: map,
                position: location,
                title: "你的位置",
              });
            },
            () => {
              alert("無法取得位置，請檢查定位權限");
            }
          );
        } else {
          alert("此瀏覽器不支援 GPS");
        }
      }
    </script>

    <!-- 替換成你自己的 Google Maps API 金鑰 -->
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
  </body>
</html>
