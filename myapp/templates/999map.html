<!DOCTYPE html>
<html>
<head>
    <title>動物受傷報告地圖</title>
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>動物受傷報告地圖</h1>
    <div id="map"></div>

    <script>
    function initMap() {
        console.log("initMap called");
        const center = { lat: 25.055, lng: 121.576 };
        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 13,
            center: center
        });

        fetch("{% url 'reports_json' %}")
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then(data => {
                console.log("取得報告資料:", data);
                data.forEach(report => {
                    if (typeof report.latitude === 'number' && typeof report.longitude === 'number') {
                        const marker = new google.maps.Marker({
                            position: { lat: report.latitude, lng: report.longitude },
                            map: map,
                            title: report.display_name
                        });
                        const infowindow = new google.maps.InfoWindow({
                            content: `<strong>${report.display_name}</strong><br>
                                      原因: ${report.reason}<br>
                                      時間: ${report.time_created}`
                        });
                        marker.addListener('click', () => {
                            infowindow.open(map, marker);
                        });
                    } else {
                        console.warn("經緯度格式錯誤:", report);
                    }
                });
            })
            .catch(error => {
                console.error("fetch 錯誤:", error);
            });
    }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap">
    </script>
</body>
</html>
