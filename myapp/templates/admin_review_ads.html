{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>廣告審核</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
    <h1>待審核廣告</h1>

    {% if ads %}
        <table border="1" cellpadding="10">
            <tr>
                <th>商家名稱</th>
                <th>廣告內容</th>
                <th>操作</th>
            </tr>
            {% for ad in ads %}
            <tr>
                <td>{{ ad.st.store_name }}</td>
                <td>{{ ad.ad_content }}</td>
                <td>
                    <a href="{% url 'review_store_ad' ad.history_id 'approve' %}">✅ 通過</a> |
                    <a href="{% url 'review_store_ad' ad.history_id 'reject' %}">❌ 拒絕</a>

                </td>
            </tr>
            {% endfor %}

        </table>
    {% else %}
        <p>目前沒有待審核的廣告。</p>
    {% endif %}
</body>
</html>
