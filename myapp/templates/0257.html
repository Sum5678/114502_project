<!DOCTYPE html>
<html>
<head>
  <title>地址標示地圖範例</title>
  <style>
    #map {
      height: 400px;
      width: 100%;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUuPZMMJvgVWftmqVyzfX8mKTwMX4kA6o&callback=initMap"></script>
</head>
<body>
  <h3>輸入地址標示地圖</h3>
  <input id="address" type="text" placeholder="請輸入地址">
  <button onclick="codeAddress()">標示地址</button>
  <div id="map"></div>

  <script>
    let map;
    let geocoder;
    let marker;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: { lat: 25.033, lng: 121.5654 }  // 台北101附近
      });
      geocoder = new google.maps.Geocoder();
    }

    function codeAddress() {
      const address = document.getElementById("address").value;
      geocoder.geocode({ 'address': address }, function(results, status) {
        if (status === 'OK') {
          map.setCenter(results[0].geometry.location);
          if (marker) {
            marker.setMap(null);
          }
          marker = new google.maps.Marker({
            map: map,
            position: results[0].geometry.location
          });
        } else {
          alert('無法找到該地址，錯誤原因: ' + status);
        }
      });
    }

    window.onload = initMap;
  </script>
</body>
</html>
