<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回報狀態</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e6f2f8;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #2c3e50;
        }
        .status-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            color: white;
        }
        .reviewing {
            background-color: #5dade2;
        }
        .completed {
            background-color: #48c9b0;
        }
        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>回報狀態</h2>
        <div class="status-section reviewing">
            <h3>審核中</h3>
            <ul id="reviewingList"></ul>
        </div>
        <div class="status-section completed">
            <h3>審核完成</h3>
            <ul id="completedList"></ul>
        </div>
        <button onclick="location.href='profile.html'">返回</button>
    </div>

    <script>
        async function fetchReportStatus() {
            try {
                const response = await fetch("get_reports.php");
                const reports = await response.json();

                document.getElementById("reviewingList").innerHTML = "";
                document.getElementById("completedList").innerHTML = "";

                reports.forEach(report => {
                    let listItem = `<li>回報 #${report.id} - ${report.date}</li>`;
                    if (report.status === "reviewing") {
                        document.getElementById("reviewingList").innerHTML += listItem;
                    } else if (report.status === "completed") {
                        document.getElementById("completedList").innerHTML += listItem;
                    }
                });
            } catch (error) {
                console.error("獲取回報狀態時發生錯誤:", error);
            }
        }

        fetchReportStatus();
    </script>
</body>
</html>
