<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>事件描述判斷</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #00509e;
      padding: 30px 20px;
      color: white;
      flex-shrink: 0;
    }

    .sidebar h3 {
      color: #ffffff;
      font-size: 1.2rem;
      margin-bottom: 25px;
      text-align: center;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .sidebar a:hover {
      background-color: #0077cc;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      background-color: #f0f4ff;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #00509e;
      margin-bottom: 30px;
      font-weight: 700;
      text-shadow: 1px 1px 2px #b3d1ff;
    }

    textarea {
      width: 100%;
      max-width: 600px;
      height: 140px;
      padding: 15px;
      border: 2px solid #00509e;
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      box-shadow: inset 1px 1px 5px #cfe3ff;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #003366;
      box-shadow: 0 0 8px #00509e88;
    }

    button {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 1.1rem;
      color: white;
      background: linear-gradient(90deg, #00509e, #0077cc);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px #00509eaa;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #0077cc, #003366);
      box-shadow: 0 6px 14px #003366cc;
    }

    button:active {
      background: #003366;
      box-shadow: none;
    }

    #result {
      margin-top: 25px;
      font-size: 1.2rem;
      font-weight: 600;
      min-height: 1.5em;
      max-width: 600px;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      color: white;
      transition: background-color 0.3s ease;
    }

    #result.success {
      background-color: #0077cc;
      box-shadow: 0 0 10px #00509e;
    }

    #result.warning {
      background-color: #fd7e14cc;
      box-shadow: 0 0 10px #cc7000;
    }

    #result.error {
      background-color: #cc0000cc;
      box-shadow: 0 0 10px #990000;
    }

    .admin-info {
      margin-bottom: 20px;
      font-size: 1.05rem;
      color: #003366;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>管理員選單</h3>
      <a href="{% url 'admin_interview' %}">自我介紹</a>
      <a href="{% url 'show_judge_page' %}">審核表單</a>
      <a href="{% url 'pemap_judge' %}">事件清單審核</a>
      <a href="{% url 'admin_logout' %}">登出</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h1>事件描述 AI 判斷</h1>

      <div class="admin-info">
        👋 歡迎管理員：ID {{ request.session.admin_id }}，姓名 {{ request.session.admin_name }}
      </div>

      <textarea id="description" placeholder="請輸入事件描述內容..."></textarea><br>
      <button onclick="submitDescription()">送出並判斷</button>
      <p id="result"></p>
    </div>
  </div>

  <script>
    function submitDescription() {
      const description = document.getElementById("description").value;

      fetch('/ai_judge/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ description: description })
      })
      .then(response => response.json())
      .then(data => {
        const resultElem = document.getElementById("result");
        resultElem.className = '';

        if (data.result === 0) {
          resultElem.innerHTML = "✅ 通過<br><small>" + (data.reason || '') + "</small>";
          resultElem.classList.add('success');
        } else if (data.result === 1) {
          resultElem.innerHTML = "⚠️ 描述過短<br><small>" + (data.reason || '') + "</small>";
          resultElem.classList.add('warning');
        } else {
          resultElem.innerHTML = "❌ 需要人工審核<br><small>" + (data.reason || '') + "</small>";
          resultElem.classList.add('error');
        }
      })


      .catch(error => {
        const resultElem = document.getElementById("result");
        resultElem.innerText = "❌ 發生錯誤：" + error;
        resultElem.className = "error";
      });
    }
  </script>
</body>
</html>
