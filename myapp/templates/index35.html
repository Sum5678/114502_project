<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可疑人物公布欄</title>
    {% load static %}

    <style>
        /* 設定整體頁面樣式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f9f9f9;
        }

        /* 側邊選單 */
        #sidebar {
            width: 220px;
            background: #333;
            color: white;
            padding: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }

        #sidebar h2 {
            text-align: center;
        }

        #sidebar ul {
            list-style: none;
            padding: 0;
        }

        #sidebar ul li {
            padding: 10px 0;
        }

        #sidebar ul li a {
            color: white;
            text-decoration: none;
        }

        /* 主要內容區 */
        #content {
            margin-left: 240px;
            padding: 20px;
            flex-grow: 1;
        }

        /* 頁面標題 */
        header {
            background-color: #d9534f;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        /* 可疑人物列表標題 */
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 公布欄區域 */
        #alert-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 可疑人物卡片容器 */
        .alert-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        /* 可疑人物卡片 */
        .alert-card {
            background: white;
            border: 2px solid #d9534f;
            padding: 15px;
            width: 100%;
            max-width: 800px;
            min-height: 100px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* 卡片標題 */
        .alert-card h3 {
            color: #d9534f;
        }

        /* 按鈕樣式 */
        button {
            background: #d9534f;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 側邊選單 -->
    <nav id="sidebar">
        <h2>選單</h2>
        <ul>
            <li><a href="{% url 'home' %}">首頁</a></li>
            <li><a href="{% url 'index35' %}">可疑人物列表</a></li>
            <li><a href="{% url 'area' %}">地區</a></li> <!-- 修改這一行 -->
        </ul>
        
    </nav>

    <div id="content">
        <!-- 網頁標題 -->
        <header>
            <h1>可疑人物公布欄</h1>
        </header>

        <!-- 可疑人物列表標題 -->
        <h2>可疑人物列表</h2>

        <!-- 公布欄顯示區域 -->
        <section id="alert-container">
            <div class="alert-wrapper">
                <!-- JavaScript 會動態插入 .alert-card -->
            </div>
        </section>
    </div>

    <!-- 在 HTML 內嵌入 JavaScript -->
    <script>
        // 初始可疑人物資料
        const alerts = [
            { id: 1, name: "紅色帽子男子", times: 5, location: "台北市信義區", details: "跟蹤女性" },
            { id: 2, name: "藍色外套男子", times: 6, location: "新北市三重區", details: "隨機拍攝行人" },
            { id: 3, name: "灰色連帽男子", times: 7, location: "桃園市中壢區", details: "偷拍女性" },
            { id: 4, name: "黑色夾克男子", times: 6, location: "新北市新莊區", details: "跟蹤女性" },
            { id: 5, name: "白色口罩男子", times: 8, location: "台中市西屯區", details: "持續徘徊於學校門口" },
            { id: 6, name: "綠色運動衫男子", times: 4, location: "高雄市左營區", details: "尾隨路人" },
            { id: 7, name: "棕色風衣男子", times: 9, location: "台南市東區", details: "試圖與陌生人強行搭話" },
            { id: 8, name: "黑色連帽外套男子", times: 5, location: "新竹市北區", details: "夜間跟蹤女性" },
            { id: 9, name: "藍色棒球帽男子", times: 7, location: "嘉義市東區", details: "多次出現在住宅區" },
            { id: 10, name: "深灰色西裝男子", times: 6, location: "基隆市仁愛區", details: "持續注視並靠近女性" }
        ];

        // 確保 DOM 內容加載完畢後執行
        document.addEventListener("DOMContentLoaded", function() {
            const alertContainer = document.querySelector(".alert-wrapper");

            // 遍歷可疑人物數據並顯示
            alerts.forEach(alert => {
                if (alert.times >= 4) { // 若該人物出現次數 >= 4
                    const card = document.createElement("div");
                    card.className = "alert-card";
                    card.innerHTML = ` 
                        <h3><a href="anonymous-chat.html?person=${encodeURIComponent(alert.name)}" target="_blank">${alert.name}</a></h3>
                        <p><strong>地點：</strong>${alert.location}</p>
                        <p><strong>行為：</strong>${alert.details}</p>
                        <p><strong>出現次數：</strong>${alert.times} 次</p>
                    `;
                    alertContainer.appendChild(card);
                }
            });
        });
    </script>
</body>
</html>
