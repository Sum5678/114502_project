<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>警局資料管理</title>

    <!-- ✅ Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        table, th, td {
            border: 1px solid #aaa;
            border-collapse: collapse;
            padding: 3px;
        }
        th {
            background-color: #eee;
        }
        a.button {
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            text-decoration: none;
            border-radius: 3px;
        }
        a.button:hover {
            background-color: #45a049;
        }
        a.delete {
            background-color: #f44336;
        }
        a.delete:hover {
            background-color: #c0392b;
        }
        .address-cell {
            max-width: 250px;
            word-break: break-word;
            white-space: normal;
        }
    </style>
</head>
<body class="bg-light">

<!-- ✅ 真正置中：使用 Bootstrap container + mx-auto -->
<div class="container-sm my-5">
    <div class="text-center mb-4">
        <h1>警局資料列表</h1>
        <a href="{% url 'police_address_add' %}" class="button my-2 d-inline-block">新增警局資料</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped mx-auto" style="max-width: 1000px;">
            <thead>
                <tr>
                    <th>警局名稱</th>
                    <th>郵遞區號</th>
                    <th>地址</th>
                    <th>電話</th>
                    <th>經度 (POINT_X)</th>
                    <th>緯度 (POINT_Y)</th>
                    <th>動作</th>
                </tr>
            </thead>
            <tbody>
                {% for addr in addresses %}
                <tr>
                    <td>{{ addr.precinct_name }}</td>
                    <td>{{ addr.zipcode }}</td>
                    <td class="address-cell">{{ addr.address }}</td>
                    <td>{{ addr.phone }}</td>
                    <td>{{ addr.POINT_X }}</td>
                    <td>{{ addr.POINT_Y }}</td>
                    <td>
                        <a href="{% url 'police_address_edit' addr.pk %}" class="button">編輯</a>
                        <a href="{% url 'police_address_delete' addr.pk %}" class="button delete">刪除</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="7">目前沒有資料</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
