<!DOCTYPE html>
<html>
<head>
    <title>警局資料管理</title>
    <style>
        table, th, td { border: 1px solid #aaa; border-collapse: collapse; padding: 3px; }
        th { background-color: #eee; }
        a.button { background-color: #4CAF50; color: white; padding: 4px 8px; text-decoration: none; border-radius: 3px; }
        a.button:hover { background-color: #45a049; }
        a.delete { background-color: #f44336; }
        a.delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>
<h1>警局資料列表</h1>

<a href="{% url 'police_address_add' %}" class="button">新增警局資料</a>
<br><br>

<table>
    <tr>
        <th>警局名稱</th>
        <th>郵遞區號</th>
        <th>地址</th>
        <th>電話</th>
        <th>經度 (POINT_X)</th>
        <th>緯度 (POINT_Y)</th>
        <th>動作</th>
    </tr>
    {% for addr in addresses %}
    <tr>
        <td>{{ addr.precinct_name }}</td>
        <td>{{ addr.zipcode }}</td>
        <td>{{ addr.address }}</td>
        <td>{{ addr.phone }}</td>
        <td>{{ addr.POINT_X }}</td>
        <td>{{ addr.POINT_Y }}</td>
        <td>
            <a href="{% url 'police_address_edit' addr.pk %}" class="button">編輯</a>
            <a href="{% url 'police_address_delete' addr.pk %}" class="button delete">刪除</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="7">目前沒有資料</td></tr>
    {% endfor %}
</table>
</body>
</html>
