{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教育網頁資源</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f8ff;
            padding: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .img-button {
            width: 290px;
            height: 260px;
            border: none;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .img-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        .button-text {
            font-size: 18px;
            margin-top: 10px;
            color: #555;
        }
        .back-button {
            margin-top: 30px;
        }
        .back-button a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .back-button a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>防身相關知識網頁</h1>
    <div class="button-container">
        {% for page in pages %}
        <form action="{{ page.url }}" target="_blank">
            <button type="submit" class="img-button"
                style="background-image: url('{% if page.image_url|slice:":4" == "http" %}{{ page.image_url }}{% else %}{% static page.image_url %}{% endif %}');">
            </button>
            <p class="button-text">{{ page.title }}</p>
        </form>
        {% endfor %}
    </div>

    <div class="back-button">
        <a href="http://127.0.0.1:8000/harassment_prevention/">返回防止騷擾頁面</a>
    </div>
</body>
</html>
