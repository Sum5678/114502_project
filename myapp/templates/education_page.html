{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教育網頁資源</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f8ff;
            padding: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .img-button {
            width: 290px;
            height: 260px;
            border: none;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .img-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        .button-text {
            font-size: 18px;
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>防身相關知識網頁</h1>
    <div class="button-container">
        <form action="https://www.wpb.police.ntpc.gov.tw/cp-3284-116967-30.html" target="_blank">
            <button type="submit" class="img-button" style="background-image: url('{% static 'images/image1.png' %}');"></button>
            <p class="button-text">兒童防身術</p>
        </form>
        
        <form action="https://www.uho.com.tw/article-50049.html" target="_blank">
            <button type="submit" class="img-button" style="background-image: url('{% static 'images/image2.jpg' %}');"></button>
            <p class="button-text">牢記防身術四要點　靠人前先靠自己</p>
        </form>

        <form action="https://www.pthg.gov.tw/womenchild/News_Content.aspx?n=198E5101A4B63ED9&s=02865F9DABE07F70" target="_blank">
            <button type="submit" class="img-button" style="background-image: url('{% static 'images/image3.jpg' %}');"></button>
            <p class="button-text">「認識搭訕騷擾懶人包」看過來！</p>
        </form>

        <form action="{% url 'harassment_prevention' %}">
            <button type="submit" class="img-button" style="background-image: url('https://i.imgur.com/rW6nKt4.png');"></button>
            <p class="button-text">防止騷擾相關資訊</p>
        </form>
    </div>
</body>
</html>
