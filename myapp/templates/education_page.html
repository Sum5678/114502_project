{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>教育網頁資源</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f8ff;
            padding: 5px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .img-button {
            width: 290px;
            height: 260px;
            border: none;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .img-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        .button-text {
            font-size: 18px;
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>防身相關知識網頁</h1>
    <div class="button-container">
        {% for page in pages %}
        <form action="{{ page.url }}" target="_blank">
            <button type="submit" class="img-button" style="background-image: url('{% url 'education_image' page.id %}');"></button>
            <p class="button-text">{{ page.title }}</p>
        </form>
        {% endfor %}
    </div>
</body>
</html>
