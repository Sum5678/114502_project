<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>商家資料上傳</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef6f9;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>商家資料上傳</h2>
    <form id="businessForm">
      <label>商家店名</label>
      <input type="text" name="bs_name" required>

      <label>營業時間</label>
      <input type="text" name="bs_time" required>

      <label>地址</label>
      <input type="text" name="bs_address" required>

      <label>電話</label>
      <input type="text" name="bs_phone" required>

      <button type="submit">上傳</button>
    </form>
  </div>

  <script>
    document.getElementById("businessForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      const list = JSON.parse(localStorage.getItem("businesses")) || [];
      data.business_id = "B" + Date.now();
      data.status = "審核中";
      list.push(data);
      localStorage.setItem("businesses", JSON.stringify(list));
      alert("資料已上傳！");
      e.target.reset();
    });
  </script>
</body>
</html>
