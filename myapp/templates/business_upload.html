<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>商家資料上傳</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef6f9;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>商家資料上傳</h2>
    <form id="businessForm">
      <label for="bs_name">商家店名</label>
      <input type="text" name="bs_name" id="bs_name" required>

      <label for="bs_time_start">營業開始時間</label>
      <input type="time" name="bs_time_start" id="bs_time_start" required>

      <label for="bs_time_end">營業結束時間</label>
      <input type="time" name="bs_time_end" id="bs_time_end" required>

      <label for="bs_address">地址</label>
      <input type="text" name="bs_address" id="bs_address" required>

      <label for="bs_phone">電話</label>
      <input type="text" name="bs_phone" id="bs_phone" required>

      <button type="submit">上傳</button>
    </form>
  </div>

  <script>
    document.getElementById("businessForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      // 合併營業時間
      data.business_hours = data.bs_time_start + " - " + data.bs_time_end;
      delete data.bs_time_start;
      delete data.bs_time_end;

      // 加入 st_id 和 created_at
      data.st_id = "B" + Date.now();
      data.created_at = new Date().toISOString();

      // 發送到後端 PHP 處理
      fetch("upload.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => res.text())
      .then(result => {
        alert(result);
        e.target.reset();
      })
      .catch(err => {
        console.error(err);
        alert("上傳失敗！");
      });
    });
  </script>
</body>
</html>
