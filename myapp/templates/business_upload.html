<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>商家資料上傳</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef6f9;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>商家資料上傳</h2>
    <form id="businessForm">
      <label for="bs_name">商家店名</label>
      <input type="text" name="bs_name" id="bs_name" required>

      <label for="bs_time_start">營業開始時間</label>
      <input type="time" name="bs_time_start" id="bs_time_start" required>

      <label for="bs_time_end">營業結束時間</label>
      <input type="time" name="bs_time_end" id="bs_time_end" required>

      <label for="bs_address">地址</label>
      <input type="text" name="bs_address" id="bs_address" required>

      <label for="bs_phone">電話</label>
      <input type="text" name="bs_phone" id="bs_phone" required>

      <button type="submit">上傳</button>
    </form>
  </div>

<script>
  document.getElementById("businessForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    // 合併營業時間
    data.business_hours = data.bs_time_start + " - " + data.bs_time_end;
    delete data.bs_time_start;
    delete data.bs_time_end;

    // 對應欄位修正
    data.store_name = data.bs_name;
    data.phone = data.bs_phone;
    data.address = data.bs_address;

    // ➤ 主鍵欄位（整數），避免過大用秒級 timestamp
    data.st_id = Math.floor(Date.now() / 1000);

    // ➤ 必須是已存在的 this_user_profile.id（如 1 or 2）
    data.poster_id = 1;

    // ➤ MySQL DATETIME 格式
    const now = new Date();
    data.created_at = now.toISOString().slice(0, 19).replace("T", " ");  // '2025-06-27 14:52:00'

    // 發送至 Django 後端處理
    fetch("/api/submit_store/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === "success") {
        alert("✅ 上傳成功！");
        e.target.reset();
      } else {
        alert("❌ 上傳失敗：" + result.message);
        console.error("伺服器錯誤訊息：", result.message);
      }
    })
    .catch(err => {
      console.error(err);
      alert("❌ 發生錯誤，請稍後再試");
    });
  });
</script>
</body>
</html>
