<!DOCTYPE html>
{% load static %}
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>寄送審核通知</title>

  <!-- Bootstrap CSS -->
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
  <!-- 其他樣式 -->
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet" />
</head>

<body class="index-page">
  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <h1 class="sitename">管理員寄信系統</h1>
      <a class="btn btn-outline-secondary" href="{% url 'admin_logout' %}">登出</a>
    </div>
  </header>

  <main class="main" style="padding-top: 100px;">
    <section class="section light-background">
      <div class="container" data-aos="fade-up">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm p-4">
              <h2 class="mb-4">寄送審核未通過通知</h2>

              <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                  <label for="to_email" class="form-label">收件人 Email</label>
                  <input type="email" class="form-control" id="to_email" name="to_email" value="{{ to_email }}" readonly />
                </div>

                <div class="mb-3">
                  <label for="subject" class="form-label">主旨</label>
                  <input type="text" class="form-control" id="subject" name="subject" value="您的報告審核未通過通知" required />
                </div>

                <div class="mb-3">
                  <label for="message" class="form-label">內容</label>
                  <textarea class="form-control" id="message" name="message" rows="6" required>您好，您的報告經過審核後未通過...</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">寄送郵件</button>
              </form>

            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>
</body>

</html>
