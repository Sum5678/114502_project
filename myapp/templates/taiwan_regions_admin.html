<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <title>台灣地區管理系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #aaa;
            border-collapse: collapse;
            padding: 6px;
        }
        th {
            background-color: #eee;
        }
        a.button, button.button {
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            text-decoration: none;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        a.button:hover, button.button:hover {
            background-color: #45a049;
        }
        a.delete, button.delete {
            background-color: #f44336;
        }
        a.delete:hover, button.delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<h1>台灣縣市／鄉鎮市區管理</h1>

<!-- 新增資料按鈕 -->
<a href="{% url 'taiwan_regions_add' %}" class="button">新增縣市資料</a>
<br><br>

<!-- 資料表格 -->
<table>
    <tr>
        <th>ID</th>
        <th>郵遞區號</th>
        <th>縣市</th>
        <th>鄉鎮市區</th>
        <th>操作</th>
    </tr>
    {% for r in regions %}
    <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.zipcode }}</td>
        <td>{{ r.country_city }}</td>
        <td>{{ r.district_town }}</td>
        <td>
            <a href="{% url 'taiwan_regions_edit' r.id %}" class="button">編輯</a>
            <a href="{% url 'taiwan_regions_delete' r.id %}" class="button delete" onclick="return confirm('確定刪除？')">刪除</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">目前沒有資料</td></tr>
    {% endfor %}
</table>

</body>
</html>
