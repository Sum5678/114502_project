<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>使用者資訊</title>
</head>
<body>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% else %}
        <h2>歡迎，{{ name }}</h2>
        <p>Google ID：{{ google_id }}</p>
        <p>Email：{{ email }}</p>
        <img src="{{ picture }}" alt="你的大頭照" style="border-radius: 50%; width: 100px;">
        
        <!-- 登出按鈕 -->
        <form action="{% url '01_userlogin_out' %}" method="post">
            {% csrf_token %}
            <button type="submit">登出</button>
        </form>
    {% endif %}
</body>
</html>
