<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料設定</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }
        .profile-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid #ccc;
            transition: opacity 0.3s;
        }
        .profile-image:hover {
            opacity: 0.7;
        }
        .hidden-input {
            display: none;
        }
        h2 {
            margin-bottom: 30px;
        }
        .profile-item {
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .profile-item:hover {
            background-color: #f0f0f0;
        }
        .profile-item span {
            font-weight: bold;
            color: #333;
        }
        .edit-form {
            display: none;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            font-size: 16px;
        }
        .bio-input {
            width: 100%;
            height: 100px;
            resize: none;
        }
        .report-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .report-button:hover {
            background-color: #45a049;
        }
    </style>
    <script>
        function editField(field) {
            document.getElementById(field + '-display').style.display = 'none';
            document.getElementById(field + '-edit').style.display = 'block';
        }

        function saveField(field) {
            var value = document.getElementById(field).value;
            document.getElementById(field + '-text').textContent = value;
            document.getElementById(field + '-display').style.display = 'block';
            document.getElementById(field + '-edit').style.display = 'none';
        }

        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var imgElement = document.getElementById('profile-pic');
                imgElement.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</head>
<body>
    <div class="profile-container">
        <h2>個人資料設定</h2>

        <!-- 頭像區 -->
        <label for="upload-image">
            <img src="https://via.placeholder.com/150" alt="頭像" id="profile-pic" class="profile-image">
        </label>
        <input type="file" id="upload-image" class="hidden-input" accept="image/*" onchange="previewImage(event)">

        <div class="profile-item" onclick="editField('name')" id="name-display">
            <span>姓名：</span> <span id="name-text">請輸入</span>
        </div>
        <div class="edit-form" id="name-edit">
            <input type="text" id="name" class="input-field" onblur="saveField('name')" placeholder="請輸入姓名">
        </div>

        <div class="profile-item" onclick="editField('email')" id="email-display">
            <span>Gmail：</span> <span id="email-text">請輸入</span>
        </div>
        <div class="edit-form" id="email-edit">
            <input type="email" id="email" class="input-field" onblur="saveField('email')" placeholder="請輸入 Gmail">
        </div>

        <div class="profile-item" onclick="editField('gender')" id="gender-display">
            <span>性別：</span> <span id="gender-text">請選擇</span>
        </div>
        <div class="edit-form" id="gender-edit">
            <select id="gender" class="input-field" onchange="saveField('gender')">
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="other">其他</option>
            </select>
        </div>

        <div class="profile-item" onclick="editField('phone')" id="phone-display">
            <span>手機號碼：</span> <span id="phone-text">請輸入</span>
        </div>
        <div class="edit-form" id="phone-edit">
            <input type="tel" id="phone" class="input-field" pattern="[0-9]{10}" onblur="saveField('phone')" placeholder="請輸入手機號碼">
        </div>

        <div class="profile-item" onclick="editField('birthday')" id="birthday-display">
            <span>生日：</span> <span id="birthday-text">請輸入</span>
        </div>
        <div class="edit-form" id="birthday-edit">
            <input type="date" id="birthday" class="input-field" onblur="saveField('birthday')">
        </div>

        <!-- 自我介紹 -->
        <div class="profile-item" onclick="editField('bio')" id="bio-display">
            <span>自我介紹：</span> <span id="bio-text">請輸入</span>
        </div>
        <div class="edit-form" id="bio-edit">
            <textarea id="bio" class="input-field bio-input" onblur="saveField('bio')" placeholder="請輸入自我介紹"></textarea>
        </div>

        <!-- 回報狀態按鈕 -->
        <a href="C:\Users\USER\114502_project11056045 - 複製\myapp\templates\status.html" class="report-button">回報狀態</a>
    </div>
</body>
</html>
