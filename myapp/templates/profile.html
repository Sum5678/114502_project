<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>個人資料設定</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #eaf4fd;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }
    .profile-container {
      width: 100%;
      max-width: 600px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-top: 20px;
      text-align: center;
      border: 2px solid #a7c7e7;
      position: relative;
    }
    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .top-right-buttons button {
      margin-left: 10px;
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background-color: #66b3ff;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .top-right-buttons button:hover {
      background-color: #4d9fdb;
    }
    .profile-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid #cce4f7;
      transition: opacity 0.3s;
    }
    .profile-image:hover {
      opacity: 0.7;
    }
    .hidden-input {
      display: none;
    }
    h2 {
      margin-bottom: 30px;
      color: #337ab7;
    }
    .profile-item {
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f5fbfd;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .profile-item span {
      font-weight: bold;
      color: #555;
    }
    .edit-form {
      display: none;
      margin-top: 10px;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      border: 1px solid #a7c7e7;
      border-radius: 5px;
      background-color: #ffffff;
      font-size: 16px;
    }
    .bio-input {
      height: 100px;
      resize: none;
    }
    .report-button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      background-color: #66b3ff;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .report-button:hover {
      background-color: #4d9fdb;
    }
  </style>
  <script>
    let isEditing = false;
    const fields = ["name", "email", "gender", "phone", "birthday", "bio"];

    function toggleEditMode() {
      isEditing = !isEditing;

      fields.forEach(field => {
        const display = document.getElementById(field + "-display");
        const edit = document.getElementById(field + "-edit");

        if (isEditing) {
          display.style.display = "none";
          edit.style.display = "block";
        } else {
          const value = document.getElementById(field).value;
          document.getElementById(field + "-text").textContent = value;
          display.style.display = "flex";
          edit.style.display = "none";
        }
      });

      document.getElementById("edit-btn").style.display = isEditing ? "none" : "inline-block";
      document.getElementById("save-btn").style.display = isEditing ? "inline-block" : "none";
    }

    function previewImage(event) {
      var reader = new FileReader();
      reader.onload = function () {
        document.getElementById("profile-pic").src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>
</head>
<body>
  <div class="profile-container">
    <!-- 編輯與儲存按鈕 -->
    <div class="top-right-buttons">
      <button id="edit-btn" onclick="toggleEditMode()">編輯</button>
      <button id="save-btn" onclick="toggleEditMode()" style="display: none;">確定</button>
    </div>

    <h2>個人資料設定</h2>

    <label for="upload-image">
      <img src="https://via.placeholder.com/150" alt="頭像" id="profile-pic" class="profile-image" />
    </label>
    <input type="file" id="upload-image" class="hidden-input" accept="image/*" onchange="previewImage(event)" />

    <!-- 資料欄位 -->
    <div class="profile-item" id="name-display"><span>姓名：</span><span id="name-text">請輸入</span></div>
    <div class="edit-form" id="name-edit"><input type="text" id="name" class="input-field" placeholder="請輸入姓名"/></div>

    <div class="profile-item" id="email-display"><span>Gmail：</span><span id="email-text">請輸入</span></div>
    <div class="edit-form" id="email-edit"><input type="email" id="email" class="input-field" placeholder="請輸入 Gmail"/></div>

    <div class="profile-item" id="gender-display"><span>性別：</span><span id="gender-text">請選擇</span></div>
    <div class="edit-form" id="gender-edit">
      <select id="gender" class="input-field">
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="profile-item" id="phone-display"><span>手機號碼：</span><span id="phone-text">請輸入</span></div>
    <div class="edit-form" id="phone-edit">
      <input type="tel" id="phone" class="input-field" pattern="[0-9]{10}" placeholder="請輸入手機號碼"/>
    </div>

    <div class="profile-item" id="birthday-display"><span>生日：</span><span id="birthday-text">請輸入</span></div>
    <div class="edit-form" id="birthday-edit"><input type="date" id="birthday" class="input-field"/></div>

    <div class="profile-item" id="bio-display"><span>自我介紹：</span><span id="bio-text">請輸入</span></div>
    <div class="edit-form" id="bio-edit">
      <textarea id="bio" class="input-field bio-input" placeholder="請輸入自我介紹"></textarea>
    </div>

    <!-- 回報紀錄 -->
    <a href="C:\Users\USER\114502_project11056045\myapp\templates\report_list.html" class="report-button">回報紀錄</a>
  </div>
</body>
</html>
