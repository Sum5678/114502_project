<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>付款完成</title>
</head>
<body>
    <script>
        // 父頁接收訊息更新狀態
        if (window.opener) {
            window.opener.postMessage({
                paid: true,
                st_id: "{{ st_id }}",
                item: "{{ item }}",
                amount: "{{ amount }}"
            }, "*");
        }
        // 關閉自己分頁
        window.close();
    </script>
    <h3>付款完成，頁面即將關閉...</h3>
</body>
</html>
